<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Sapline</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Sapline look: a warm maple palette (day and night), rounded game-panel cards, pill tabs, numbers in tabular figures.
   Every colour is a token on :root; the night set is under prefers-color-scheme and data-theme=dark. Original artwork only. */
:root{
  --bg:#f8efe0;--card:#fffdf8;--sf:#f5ead7;--tx:#3a2a1a;--mu:#8a7055;--bd:#eadbc3;
  --ac:#f08a24;--acbg:#fde8cf;--sky:#b9591a;--skybg:#fbe6cf;--ok:#3f9a3a;--bad:#d2473a;
  --gold:#d99a1e;--leaf:#4fa349;--glow:rgba(240,138,36,.18);--shadow:0 1px 2px rgba(74,45,15,.06),0 10px 24px -16px rgba(74,45,15,.35);
  --display:Nunito,ui-rounded,ui-sans-serif,system-ui,sans-serif;
  --body:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171a24;--card:#20243a;--sf:#282d44;--tx:#f3e9d8;--mu:#a99b88;--bd:#343a52;
  --ac:#f59a37;--acbg:#3b2a16;--sky:#f3b35f;--skybg:#3a2d1b;--ok:#7ccb6e;--bad:#f2847a;--gold:#f2c35a;--leaf:#7ccb6e;
  --glow:rgba(245,154,55,.22);--shadow:0 1px 2px rgba(0,0,0,.25),0 10px 24px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme=dark]{--bg:#171a24;--card:#20243a;--sf:#282d44;--tx:#f3e9d8;--mu:#a99b88;--bd:#343a52;--ac:#f59a37;--acbg:#3b2a16;
  --sky:#f3b35f;--skybg:#3a2d1b;--ok:#7ccb6e;--bad:#f2847a;--gold:#f2c35a;--leaf:#7ccb6e;--glow:rgba(245,154,55,.22);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 24px -14px rgba(0,0,0,.6);color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--body);
  background-image:radial-gradient(900px 360px at 12% -8%,var(--glow),transparent 70%),radial-gradient(700px 300px at 100% 0,color-mix(in srgb,var(--leaf) 10%,transparent),transparent 70%);
  background-attachment:fixed}
main{height:100vh;box-sizing:border-box;display:flex;flex-direction:column;padding:0 24px;max-width:1320px;margin:0 auto}
@media(max-width:640px){main{padding:0 16px}}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;letter-spacing:-.01em}
h1{font-size:18px;line-height:1.15}h2{font-size:17px}
.num{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;margin:0}
.mu{color:var(--mu);font-size:13px}.up{color:var(--ok)}.dn{color:var(--bad)}.gold{color:var(--gold)}
.top{flex:none;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none;filter:drop-shadow(0 2px 3px rgba(74,45,15,.18))}
.brand p{margin:2px 0 0;color:var(--mu);font-size:13px}
@media(max-width:560px){.brand p{display:none}}
.hr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.lchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--mu);white-space:nowrap}
.lchip i{width:8px;height:8px;border-radius:50%;background:var(--mu);flex:none}
.lchip.on{color:var(--tx);background:color-mix(in srgb,var(--ok) 10%,var(--card))}.lchip.on i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.lchip.wait i{background:var(--ac)}.lchip.off{background:color-mix(in srgb,var(--bad) 8%,var(--card));color:var(--bad)}.lchip.off i{background:var(--bad)}
button,input,select{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:600;box-shadow:0 1px 0 rgba(74,45,15,.05)}
button:hover{border-color:var(--ac);background:color-mix(in srgb,var(--acbg) 45%,var(--card))}
.go{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 82%,#fff) 0%,var(--ac) 55%,color-mix(in srgb,var(--ac) 88%,#000) 100%);
  border:1px solid color-mix(in srgb,var(--ac) 70%,#000);color:#fff;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 0 color-mix(in srgb,var(--ac) 65%,#000),0 6px 14px -6px var(--ac)}
.go:hover{filter:brightness(1.05);border-color:color-mix(in srgb,var(--ac) 70%,#000);
  background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 82%,#fff) 0%,var(--ac) 55%,color-mix(in srgb,var(--ac) 88%,#000) 100%)}
.go.stop,.go.stop:hover{background:var(--sf);border:1px solid var(--bd);color:var(--tx);text-shadow:none;box-shadow:none;filter:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:8px 12px;min-height:40px;width:100%;box-sizing:border-box}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--glow);outline:none}
input::placeholder{color:var(--mu)}
#theme{min-height:38px;padding:4px 12px;font-size:13px;color:var(--mu);display:inline-flex;align-items:center;gap:6px;border-radius:999px}
#theme svg{width:16px;height:16px}
#theme .moon{display:none}:root[data-theme=dark] #theme .moon{display:inline}:root[data-theme=dark] #theme .sun{display:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) #theme .moon{display:inline}:root:not([data-theme=light]) #theme .sun{display:none}}
@media(max-width:640px){#theme span{display:none}}
main>nav{flex:none;display:flex;gap:2px;margin:4px 0 20px;padding:4px;background:var(--card);border:1px solid var(--bd);border-radius:999px;width:max-content;max-width:100%;overflow:auto;box-shadow:var(--shadow)}
main>nav button{flex:0 0 auto;border:0;background:transparent;color:var(--mu);font-weight:700;font-size:14px;padding:8px 16px;min-height:36px;border-radius:999px;box-shadow:none}
main>nav button:hover{background:var(--sf);color:var(--tx)}
main>nav button[aria-current=page]{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 82%,#fff),var(--ac));color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.15)}
main>nav button[data-nav=more]{margin-left:8px}
#app{flex:1;min-height:0;overflow:auto;padding-bottom:16px}
#app:focus{outline:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:16px;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin-bottom:8px}
.row>span,.row>b{min-width:0}
.seg{display:inline-flex;gap:4px;padding:3px;background:var(--sf);border:1px solid var(--bd);border-radius:999px}
.seg button{border:0;background:transparent;min-height:30px;padding:3px 11px;font-size:13px;border-radius:999px;color:var(--mu);box-shadow:none}
.seg button:hover{background:color-mix(in srgb,var(--card) 60%,transparent);color:var(--tx)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(74,45,15,.18)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:12px}
.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.card .tiles .tile{background:var(--sf);border:0;box-shadow:none;padding:10px 12px}.card .tiles .tile .v{font-size:22px}
.card .tiles{margin-top:0}.card>.tiles+.tiles{margin-top:8px}
@media(max-width:700px){.tiles.t4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.tiles.t3{grid-template-columns:minmax(0,1fr)}}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;min-width:0;box-shadow:var(--shadow)}
.tile .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:800}
.tile .v{font-family:var(--mono);font-size:26px;font-weight:500;line-height:1.2;margin:2px 0 6px}
.tile .v.gold{color:var(--gold)}.tile .v small{font-size:14px;font-weight:600;color:var(--mu);font-family:var(--body)}
.warm .tile .v,.warm .big{opacity:.55}
.xband{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between}
.xband .big{font-family:var(--mono);font-size:40px;color:var(--gold);line-height:1.1}.xband .big small{font-size:14px;color:var(--mu)}
.xvs{font-size:13px;font-weight:700}
.xspark{display:flex;align-items:flex-end;gap:3px;height:44px;width:140px}
.xspark i,.xchart i{flex:1;border-radius:2px;background:color-mix(in srgb,var(--ac) 32%,transparent);min-height:2px}
.xspark i:last-child,.xchart i:last-child{background:var(--ac)}
.xband .tiles{flex:1 1 320px;max-width:540px}
.xgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start;margin-top:16px}
.xlv{display:flex;align-items:baseline;gap:12px;margin:4px 0}.xlv b{font:800 48px/1 var(--display)}.xlv .num{font-size:22px;color:var(--gold)}
.xbar{height:14px;border-radius:99px;background:var(--sf);overflow:hidden;margin:6px 0 10px;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.xbar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),color-mix(in srgb,var(--leaf) 70%,#ff0));border-radius:99px}
.xchart{display:flex;align-items:flex-end;gap:6px;height:150px;margin:10px 0 6px}
.xchart i{border-radius:5px 5px 2px 2px}
.xline{display:block;width:100%;height:150px;margin:10px 0 6px;overflow:visible}.xline polyline{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linejoin:round}
.xline .xa{fill:color-mix(in srgb,var(--ac) 18%,transparent)}.xline circle{fill:var(--ac)}.xopts{display:flex;gap:8px;flex-wrap:wrap}
.ax{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
.xctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.xctl .go{min-height:44px;padding:0 20px;font-size:15px}
.xidle{color:var(--sky);font-weight:700}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:800;padding:6px 8px;border-bottom:1px solid var(--bd)}
td{padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
tr.now td{color:var(--sky)}
td button{min-height:32px;padding:2px 10px;font-size:13px;margin-left:4px}td input{width:170px;min-height:32px}
td.mob{display:flex;align-items:center;gap:8px}img.mp{height:40px;max-width:72px;object-fit:contain;cursor:pointer;border-radius:6px;background:var(--sf)}
input.mn{width:180px;min-height:32px}td.mob button{min-height:32px;padding:2px 10px;font-size:13px}
.xlon{display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}.xlon input{width:18px;height:18px;min-height:0;margin:0;padding:0;flex:none}
.upd{border:2px solid var(--ac);background:linear-gradient(135deg,var(--acbg),var(--card) 60%)}
.oh2{margin:4px 0 10px}
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:20px}
.oc{margin:0;display:flex;flex-direction:column;gap:8px}.oc p{margin:0}
.oc .oh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.oc .oh label:first-child{cursor:pointer}
.oc select{width:auto;align-self:flex-start}.oc .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;min-height:0;z-index:1;width:100%;height:100%}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--bd);transition:background .15s;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+span{background:var(--ac)}.sw input:checked+span::after{transform:translateX(18px)}
.sw input:focus-visible+span{outline:2px solid var(--ac);outline-offset:2px}
.notes{margin:0;padding:0;list-style:none;font-size:13px}
.notes li{padding:6px 0;border-top:1px solid var(--bd);color:var(--mu);display:flex;gap:8px}
.notes li:first-child{border-top:0}.notes li b{font-family:var(--mono);font-weight:500;flex:none}
.notes li.warn{color:var(--sky)}.notes li.error{color:var(--bad)}
#live{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;margin:0;max-width:min(560px,calc(100vw - 32px));box-sizing:border-box;
  background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow)}
#live:empty{display:none}
.stance{font-size:14px}.stance p{margin:0 0 8px}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s,color .15s,transform .1s}button:active{transform:translateY(1px)}}
</style>
<main>
<header class="top"><div class="brand"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="var(--acbg)"/><path d="M16 4.5l2.2 4.6 4.6-1.8-1.5 4.7 5 1.7-4 2.8 2.6 4.6-5.1-1.2L16 27.5l-3.8-7.6-5.1 1.2 2.6-4.6-4-2.8 5-1.7-1.5-4.7 4.6 1.8z" fill="var(--ac)"/><path d="M16 14v12" stroke="color-mix(in srgb,var(--ac) 70%,#000)" stroke-width="1.6" stroke-linecap="round"/></svg><div><h1>Sapline</h1><p>EXP tracker</p></div></div><div class="hr"><span id="chip" class="lchip"><i></i><span>Starting…</span></span><button id="theme" aria-label="Switch between the day and night look" title="Day or night look"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Theme</span></button></div></header>
<nav aria-label="Sections"><button data-nav="exp" aria-current="page">EXP</button><button data-nav="runs">Runs</button><button data-nav="mobs">Mobs</button><button data-nav="more">Options</button></nav>
<div id="app" tabindex="-1"></div><p id="live" role="status" aria-live="polite"></p>
</main>
<script>
/* Sapline: the page MapleReader shows. It asks the app (http://127.0.0.1:8765) for its state once a second and
   sends button presses as small requests. Nothing here talks to anything but the app on this PC. */
const $ = s => document.querySelector(s),
  fmt = n => Math.round(n).toLocaleString("en-US"),
  esc = x => String(x).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]),
  KEY = "sap1",
  LOCAL = location.protocol === "http:" && /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
let view = "exp",
  xr = "session", // the chart: this session or the last 7 days
  xkind = "bars", // bars or a line
  xlog = false,   // ...on a log scale
  xren = null;    // the run being renamed
const APP = { seq: 0, st: null, notes: [], lost: false };
const segBtns = (name, cur, opts) =>
  `<span class="seg" role="group">${opts.map(([v, t]) => `<button data-${name}="${v}" aria-pressed="${v === cur}">${t}</button>`).join("")}</span>`;
const optCard = (id, title, desc, on) => `<div class="card oc"><div class="oh"><label for="${id}"><b>${title}</b></label><label class="sw">` +
  `<input type="checkbox" id="${id}"${on ? " checked" : ""}><span></span></label></div><p class="mu">${desc}</p></div>`;
const mins = m => (m < 60 ? m + " min" : `${Math.floor(m / 60)} h ${m % 60} min`);
async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "X-MapleReader": "1", "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  return r.json().catch(() => ({ ok: false, error: "No answer from MapleReader." }));
}
// Short messages ("EXP tracking starts again from now") show at the bottom of the window for a few seconds
function say(m) {
  const el = $("#live");
  el.textContent = m;
  clearTimeout(say.t);
  say.t = setTimeout(() => (el.textContent = ""), 6000);
}
function setTheme(dark) {
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  try { localStorage.setItem(KEY + ":theme", dark ? "dark" : "light"); } catch (e) {}
}
const isDark = () => document.documentElement.dataset.theme === "dark";
function saveCharts() {
  try { localStorage.setItem(KEY + ":charts", JSON.stringify({ xk: xkind, xs: xlog })); } catch (e) {}
}
/* ===== Talking to the app ===== */
async function appPull() {
  try {
    const r = await fetch("/api/state?since=" + APP.seq, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    APP.st = j;
    APP.lost = false;
    for (const e of j.events) APP.notes.unshift(e);
    APP.notes.length = Math.min(APP.notes.length, 12);
    APP.seq = j.seq;
    drawChip();
    if (view === "exp") drawExp();
    else if (view === "runs") drawRuns();
    else if (view === "mobs") drawMobs();
    else if (view === "more") updOpts(j);
  } catch (e) {
    APP.lost = true;
    drawChip();
  }
  setTimeout(appPull, 1000);
}
// The status pill in the header: what the recorder is doing, in a few words
function drawChip() {
  const st = APP.st || {}, x = st.exp, c = $("#chip");
  let cls = "", text = "Starting…";
  if (APP.lost) [cls, text] = ["off", "MapleReader has closed"];
  else if (!st.exp_on) [cls, text] = ["", "Not recording"];
  else if (!x) [cls, text] = ["wait", st.exp_found ? "Reading your EXP…" : "Looking for the EXP line"];
  else if (x.idle) [cls, text] = ["wait", `Paused · Lv ${x.level || "—"}`];
  else [cls, text] = ["on", `Recording · Lv ${x.level || "—"}${x.per_hour != null && !x.warm ? " · " + fmt(x.per_hour) + "/h" : ""}`];
  c.className = "lchip " + cls;
  c.lastElementChild.textContent = text;
}
function draw() {
  document.querySelectorAll("[data-nav]").forEach(b => (b.dataset.nav === view ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")));
  $("#app").dataset.html = "";
  if (!LOCAL) {
    $("#app").innerHTML = '<div class="card"><b>This page is part of MapleReader.</b><p class="mu">Open MapleReader; it shows this page in its own window.</p></div>';
    return;
  }
  ({ exp: drawExp, runs: drawRuns, mobs: drawMobs, more: drawMore })[view](true);
  $("#app").focus({ preventScroll: true });
}
// Redraw only when something changed, and never while a box is being typed in
function put(html, force) {
  const el = $("#app"), ae = document.activeElement || {};
  if (!force && (ae.id === "xrn" || (ae.classList && ae.classList.contains("mn")))) return;
  if (force || el.dataset.html !== html) {
    el.innerHTML = html;
    el.dataset.html = html;
    if (xren && $("#xrn")) $("#xrn").focus();
  }
}
/* ===== EXP tab ===== numbers from ExpTracker.summary in exp.py */
function drawExp(force) {
  const st = APP.st || {}, x = st.exp, on = !!st.exp_on, D = st.exp_days || [],
    today = D.length ? D[D.length - 1].gained : 0,
    fig = (k, v, sub) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="mu">${sub}</div></div>`,
    warm = x && x.warm,
    rate = v => (v == null ? "…" : warm ? `<span title="The first 5 minutes: too early to mean much">≈${fmt(v)}</span>` : fmt(v)),
    bars = (v, lab) => {
      // log scale: a slow hour is still visible next to a fast one
      const g = xlog ? n => Math.log10(1 + n) : n => n,
        lo = xlog ? Math.min(...v.filter(n => n > 0).map(g), g(Math.max(1, ...v))) * 0.9 : 0,
        mx = Math.max(lo + 1e-9, ...v.map(g)),
        f = n => (n > 0 || !xlog ? Math.max(0, (g(n) - lo) / (mx - lo)) : 0);
      if (xkind === "line") {
        const w = 300 / Math.max(1, v.length),
          P = v.map((n, i) => [(i * w + w / 2).toFixed(1), (96 - f(n) * 90).toFixed(1)]);
        return `<svg class="xline" viewBox="0 0 300 100" preserveAspectRatio="none" role="img" aria-label="${lab}">` +
          `<polygon class="xa" points="${P[0][0]},100 ${P.map(p => p.join(",")).join(" ")} ${P[P.length - 1][0]},100"/>` +
          `<polyline points="${P.map(p => p.join(",")).join(" ")}"/>${P.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.5"/>`).join("")}</svg>`;
      }
      return `<div class="xchart" role="img" aria-label="${lab}">${v.map(n => `<i style="height:${Math.max(2, f(n) * 100).toFixed(0)}%"></i>`).join("")}</div>`;
    },
    status = !on ? "Not recording" : !x
      ? st.exp_found ? "Reading…" : "Looking for the EXP line. Keep the status bar visible."
      : x.idle ? "Paused: no EXP for a while" : warm ? "Warming up" : "Recording";
  let vs = "";
  if (x && x.hour != null && x.prev_hour) {
    const p = Math.round((x.hour / x.prev_hour - 1) * 100);
    vs = Math.abs(p) < 2 ? '<div class="xvs mu">About the same as the hour before</div>' :
      `<div class="xvs ${p > 0 ? "up" : "dn"}">${p > 0 ? "▲" : "▼"} ${Math.abs(p)}% ${p > 0 ? "faster" : "slower"} than the hour before</div>`;
  }
  const sl = x && x.slots ? x.slots : [],
    dayName = d => new Date(d.day + "T12:00:00").toLocaleDateString(undefined, { weekday: "short" }),
    chart = xr === "week"
      ? `<div class="row"><b>EXP per day</b><span class="num gold">${fmt(D.reduce((a, d) => a + d.gained, 0))}</span></div>` +
        bars(D.map(d => d.gained), "EXP gained on each of the last 7 days") +
        `<div class="ax">${D.map(d => `<span>${D.indexOf(d) === D.length - 1 ? "Today" : dayName(d)}</span>`).join("")}</div>`
      : sl.length ? `<div class="row"><b>EXP every 10 minutes</b><span class="num gold">+${fmt(sl.reduce((a, b) => a + b, 0))}</span></div>` +
        bars(sl, "EXP gained in each 10 minutes of this session") + `<div class="ax"><span>${sl.length * 10} min ago</span><span>now</span></div>`
        : '<p class="mu">No readings yet</p>',
    goals = x ? `<section class="card" aria-label="Goals"><div class="row"><b>Goals</b></div>` +
      `<div class="tiles t3">${fig("Kills to level", x.kills_left != null ? fmt(x.kills_left) : "—",
        x.kills_left != null && x.kills_total ? `about ${fmt(x.gained / x.kills_total)} EXP a kill` : "after the first kills")}` +
      `${fig("Kills per hour", rate(x.kills_per_hour), "")}` +
      `${fig(x.next_mark ? `${x.next_mark}% in` : "Next 10%", x.next_mark_text || "—", "")}</div></section>` : "",
    html = updCard(st) + `<div class="${warm ? "warm" : ""}">` +
      `<section class="card xband" aria-label="Your EXP trend"><div><div class="k mu">Your trend</div>` +
      `<div class="big">${x ? rate(x.per_hour) : "…"}<small> EXP/h</small></div>${vs}` +
      (x ? `<div class="mu">Last 5 min ${x.last5 != null ? fmt(x.last5) + "/h" : "…"} · ${x.pct_per_hour != null ? rate(x.pct_per_hour) + "%" : "…"} per hour` +
        `${x.idle ? ' · <span class="xidle">paused</span>' : ""}</div>` +
        (x.run && (x.run.map || x.run.party > 1) ? `<div class="mu">${esc(x.run.map || "")}${x.run.map && x.run.party > 1 ? " · " : ""}` +
          `${x.run.party > 1 ? "party of " + x.run.party : ""}</div>` : "") : "") + `</div>` +
      (sl.length > 1 ? `<div class="xspark" aria-hidden="true">${sl.map(n => `<i style="height:${Math.max(4, (n / Math.max(1, ...sl)) * 100).toFixed(0)}%"></i>`).join("")}</div>` : "") +
      `<div class="tiles t3">${fig("Today", fmt(today), "EXP")}` +
      `${fig("Best hour", x && x.best_hour != null ? fmt(x.best_hour) : "—", "")}` +
      `${fig("Level in", (x && x.eta_text) || "—", x && x.left != null ? fmt(x.left) + " to go" : "")}</div></section>` +
      `<div class="xgrid"><div>` +
      (x ? `<div class="card"><div class="row"><b>Level</b><span class="mu">${x.left != null ? fmt(x.left) + " to go" : ""}</span></div>` +
        `<div class="xlv"><b>${x.level || "—"}</b><span class="num">${x.pct.toFixed(2)}%</span></div>` +
        `<div class="xbar" aria-hidden="true"><i style="width:${Math.max(0, Math.min(100, x.pct))}%"></i></div>` +
        `<div class="mu num">${fmt(x.exp)}${x.need ? " of " + fmt(x.need) : ""} EXP</div></div>` +
        `<div class="card"><div class="row"><b>This session</b><span class="mu">${mins(x.minutes)}</span></div>` +
        `<div class="tiles t4">${fig("Gained", fmt(x.gained), "")}${fig("Lost", fmt(x.lost), x.lost ? "from dying" : "")}` +
        `${fig("Level-ups", x.levels, "")}${fig("Kills", fmt(x.kills_total || 0), "")}</div>` +
        `<div class="tiles t3">${fig("Damage taken", fmt(x.taken || 0), x.hits ? `${x.hits} hits · biggest ${fmt(x.big)}` : "")}` +
        `${fig("HP", x.hp ? fmt(x.hp[0]) : "—", x.hp ? "of " + fmt(x.hp[1]) : "")}` +
        `${fig("Mesos", x.mesos != null ? fmt(x.mesos) : "—", x.mesos_per_hour != null ? fmt(x.mesos_per_hour) + "/h" : x.mesos == null ? "open the Item window" : "")}</div></div>`
        : `<div class="card"><b>No reading yet</b><p class="mu" style="margin:4px 0 0">${status}</p></div>`) +
      `<div class="xctl"><button class="go${on ? " stop" : ""}" data-x="go">${on ? "Stop" : "Start"}</button><button data-x="reset">Reset</button>` +
      `${x ? `<span class="mu">${status}${(st.exp_unread || 0) + (x.skipped || 0) ? ` · ${fmt((st.exp_unread || 0) + (x.skipped || 0))} readings skipped` : ""}</span>` : ""}</div></div>` +
      `<div>${goals}<div class="xopts">${segBtns("xr", xr, [["session", "This session"], ["week", "Last 7 days"]])}` +
      `${segBtns("xk", xkind, [["bars", "Bars"], ["line", "Line"]])}${segBtns("xs", xlog ? "log" : "lin", [["lin", "Normal"], ["log", "Log scale"]])}</div>` +
      `<div class="card" style="margin-top:8px">${chart}</div>${notesHtml()}</div></div></div>`;
  put(html, force);
}
// Messages from the app (an update, a problem): the last few
function notesHtml() {
  return APP.notes.length ? `<div class="card"><b>Messages</b><ul class="notes">${APP.notes.slice(0, 6).map(n =>
    `<li class="${n.level || ""}"><b>${new Date((n.t || 0) * 1000).toTimeString().slice(0, 5)}</b><span>${esc(n.text)}</span></li>`).join("")}</ul></div>` : "";
}
// A newer MapleReader: a card at the top of the EXP tab (only when there's something to do) and a line in Options
function updCard(st) {
  const u = st.update || {}, v = esc(u.version || ""), busy = u.state === "downloading" || u.state === "installing";
  if (APP.lost || !(u.state === "available" || busy)) return "";
  return `<div class="card upd" id="upd">` + (busy
    ? `<b>Updating to ${v}…</b><p class="mu" style="margin:4px 0 0">${u.state === "downloading" ? "Downloading." : "Installing. The app restarts by itself."}</p>`
    : `<div class="row" style="margin:0"><span><b>New version ${v}</b><br><span class="mu">` +
      `${u.error ? `<span class="dn">${esc(u.error)}</span>` : "Your runs and settings stay."}</span></span>` +
      (u.can_install ? `<button class="go" data-upd="now" style="width:auto;min-height:44px;font-size:15px;padding:0 18px">Update now</button>` :
        `<button data-page="${esc(u.page || "")}">Download page</button>`) + `</div>`) + `</div>`;
}
/* ===== Runs tab ===== one line per hunt (a map and a level, until a level-up, a new map or 30 minutes without EXP) */
function drawRuns(force) {
  const st = APP.st || {}, x = st.exp, L = st.exp_log || [],
    r = x && x.run && x.run.minutes >= 1 ? x.run : null,
    logOn = (st.settings || {}).exp_log !== false,
    dt = t => new Date(t * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric" }),
    row = (e, now) => `<tr${now ? ' class="now"' : ""}><td>${now ? "Now" : dt(e.date)}</td><td>${esc(e.name || e.map || "—")}</td>` +
      `<td class="num">${e.level || "—"}</td><td>${e.party > 1 ? e.party + " in party" : "—"}</td><td class="num">${mins(e.minutes)}</td>` +
      `<td class="num">${e.per_hour == null ? "…" : fmt(e.per_hour)}</td><td class="num">${e.mesos_per_hour == null ? "—" : fmt(e.mesos_per_hour)}</td>` +
      `<td class="num" title="${esc((e.kills || []).map(k => `${k.name || k.exp + " EXP"} ×${k.n}`).join(", "))}">${e.kills_total == null ? "—" : fmt(e.kills_total)}</td>` +
      `<td class="num">${e.taken == null ? "—" : fmt(e.taken)}</td><td>` +
      (now ? "" : xren === e.id
        ? `<input id="xrn" maxlength="40" value="${esc(e.name || e.map || "")}" aria-label="Name"><button data-xl="save" data-id="${e.id}">Save</button>`
        : `<button data-xl="rename" data-id="${e.id}">Rename</button><button data-xl="delete" data-id="${e.id}">Delete</button>`) + `</td></tr>`;
  put(`<section class="card xlog" aria-label="Runs"><div class="row"><b>Your runs</b><label class="xlon"><input type="checkbox" data-xl="on"${logOn ? " checked" : ""}> Log my runs</label></div>` +
    `<p class="mu">A new line at a level-up, a new map, or after a long break.</p>` +
    (r || L.length ? `<div class="tw"><table><thead><tr><th>Date</th><th>Map</th><th>Lv</th><th>Party</th><th>Time</th><th>EXP/h</th><th>Mesos/h</th>` +
      `<th>Kills</th><th>Dmg taken</th><th></th></tr></thead><tbody>${r ? row(r, true) : ""}${L.map(e => row(e)).join("")}</tbody></table></div>`
      : '<p class="mu">No runs yet</p>') + `</section>`, force);
}
/* ===== Mobs tab ===== the kills, told apart by the EXP one kill gives, with the pictures cut from the screen */
function drawMobs(force) {
  const st = APP.st || {}, x = st.exp,
    table = (title, all, sub) => {
      const K = all.filter(k => k.name || k.n > 1),
        other = all.filter(k => !(k.name || k.n > 1)).reduce((a, k) => a + k.n, 0), // amounts seen once: shared mobs, quests
        pic = k => (k.pic ? `<img class="mp" src="/api/mobpic/${k.exp}.png" alt="" title="Click to drop this picture" data-mnx="${k.exp}">` : ""),
        row = k => `<tr><td class="mob">${pic(k)}${k.name ? esc(k.name) : `<input class="mn" data-mn="${k.exp}" maxlength="40" ` +
          `placeholder="Name this mob" aria-label="Name this mob"><button data-mns="${k.exp}">Save</button>`}</td>` +
          `<td class="num">${fmt(k.n)}</td><td class="num mu">${k.exp ? fmt(k.exp) : "—"}</td></tr>`;
      return `<section class="card xmobs" aria-label="${title}"><div class="row"><b>${title}</b><span class="num">${all.length ? fmt(all.reduce((a, k) => a + k.n, 0)) + " kills" : ""}</span></div>` +
        (sub ? `<p class="mu">${sub}</p>` : "") +
        (all.length ? `<div class="tw"><table><thead><tr><th>Mob</th><th>Kills</th><th>EXP each</th></tr></thead><tbody>${K.map(row).join("")}` +
          `${other ? `<tr><td class="mu">Other gains</td><td class="num">${fmt(other)}</td><td class="num mu">—</td></tr>` : ""}</tbody></table></div>`
          : "") + `</section>`;
    },
    hunt = x && x.run && x.run.kills && x.run.kills.length ? x.run.kills : [],
    sess = (x && x.kills) || [];
  put((hunt.length ? table("This hunt", hunt, "") : "") + (sess.length && sess !== hunt ? table("This session", sess, "") : "") +
    (hunt.length || sess.length ? `<p class="mu">Mobs are told apart by the EXP a kill gives. Name one and it stays named. Wrong picture? Click it to drop it.</p>`
      : `<div class="card"><b>No kills yet</b><p class="mu" style="margin:4px 0 0">Kills show here as your EXP goes up.</p></div>`), force);
}
/* ===== Options tab ===== */
function drawMore() {
  const st = APP.st || {}, se = st.settings || {};
  $("#app").innerHTML = `<h2 class="oh2">Recording</h2><div class="ocards">` +
    optCard("ox", "Start on open", "Record as soon as the app opens.", se.exp !== false) +
    optCard("ol", "Log my runs", "Keep a line per hunt on the Runs tab.", se.exp_log !== false) +
    `<div class="card oc"><label for="oi"><b>Pause after</b></label><p class="mu">Minutes without EXP before the clock stops.</p>` +
    `<select id="oi">${[1, 2, 3, 5, 10, 15].map(n => `<option value="${n}"${+(se.idle_min || 1) === n ? " selected" : ""}>${n} min</option>`).join("")}</select></div>` +
    `<div class="card oc"><label for="om"><b>Game screen</b></label><p class="mu">Which monitor the game is on.</p>` +
    `<select id="om">${[1, 2, 3].map(n => `<option value="${n}"${+se.monitor === n ? " selected" : ""}>Screen ${n}</option>`).join("")}</select></div>` +
    `</div><h2 class="oh2">App</h2><div class="ocards">` +
    `<div class="card oc"><b>Updates</b><p class="mu" id="updline">Updates</p><p class="mu" id="eng"></p><button id="updcheck" style="align-self:flex-start">Check now</button></div>` +
    `<div class="card oc"><b>Map names and mesos</b><p class="mu" id="tess"></p><button id="tessgo" style="align-self:flex-start" hidden>Install Tesseract</button></div>` +
    `<div class="card oc"><b>Data</b><p class="mu">Run log, day totals and mob pictures.</p><div class="btns"><button id="oscans">Open folder</button></div></div>` +
    optCard("ofp", "Save fight pictures", "For troubleshooting mob pictures. Off again at the next start.", !!se.fight_pics) +
    `</div><div class="card stance"><p><b>Sapline only reads your screen.</b> It takes screenshots and reads the status bar from them. It never clicks, types, reads the game's memory or sends anything anywhere.</p>` +
    `<p class="mu">Nexon has not said whether screen readers are allowed. Use at your own risk. Fan project, not affiliated with Nexon.</p></div>`;
  $("#ox").onchange = e => api("/api/set", { exp: e.target.checked });
  $("#ol").onchange = e => api("/api/set", { exp_log: e.target.checked });
  $("#oi").onchange = e => api("/api/set", { idle_min: +e.target.value });
  $("#om").onchange = e => api("/api/set", { monitor: +e.target.value });
  $("#ofp").onchange = e => api("/api/set", { fight_pics: e.target.checked });
  $("#oscans").onclick = () => api("/api/open-scans");
  $("#tessgo").onclick = () => api("/api/install-tesseract").then(r => say(r.ok ? "Installing Tesseract. Click Yes if Windows asks." : r.error || "Could not start the installer."));
  $("#updcheck").onclick = async () => {
    $("#updline").textContent = "Checking…";
    await api("/api/update-check");
  };
  updOpts(st);
}
function updOpts(st) {
  const line = $("#updline");
  if (!line) return;
  const u = st.update || {};
  line.textContent = {
    none: "Up to date", available: `${u.version} is ready (see the EXP tab)`, downloading: "Downloading…", installing: "Installing…",
    checking: "Checking…", offline: "Can't reach GitHub right now", unavailable: "No release to check yet", off: "Switched off"
  }[u.state] || "";
  $("#eng").textContent = `MapleReader ${st.version || ""}`;
  $("#tess").textContent = st.tesseract ? "Read for the run log (Tesseract is installed)." : "Needs Tesseract, a free text reader. EXP works without it.";
  $("#tessgo").hidden = !!st.tesseract;
}
/* ===== Buttons ===== */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-x],[data-xr],[data-xk],[data-xs],[data-xl],[data-mns],[data-mnx],[data-upd],[data-page]");
  if (!b) return;
  const d = b.dataset;
  if (d.xl) {
    const done = r => r.ok || say(r.error || "Could not change the run log.");
    if (d.xl === "on") api("/api/set", { exp_log: b.checked }).then(done);
    else if (d.xl === "rename") { xren = d.id; drawRuns(true); }
    else if (d.xl === "save") { api("/api/exp-log", { action: "rename", id: d.id, name: $("#xrn").value }).then(done); xren = null; drawRuns(true); }
    else if (d.xl === "delete") api("/api/exp-log", { action: "delete", id: d.id }).then(done);
  } else if (d.mns !== undefined || d.mnx !== undefined) {
    const exp = +(d.mns !== undefined ? d.mns : d.mnx),
      body = d.mns !== undefined ? { exp, name: ($(`[data-mn="${exp}"]`) || {}).value || "" } : { exp, action: "forget" };
    if (d.mnx !== undefined && !confirm("Drop this picture?")) return;
    api("/api/mob-name", body).then(r => (r.ok ? drawMobs(true) : say(r.error || "Could not save that.")));
  } else if (d.xr || d.xk || d.xs) {
    if (d.xr) xr = d.xr;
    if (d.xk) xkind = d.xk;
    if (d.xs) xlog = d.xs === "log";
    saveCharts();
    drawExp(true);
  } else if (d.x === "go") api("/api/set", { exp: !(APP.st && APP.st.exp_on) }).then(r => r.ok || say(r.error || "Could not change EXP recording."));
  else if (d.x === "reset") api("/api/exp-reset").then(() => say("Counting again from now"));
  else if (d.upd) api("/api/update").then(r => r.ok || say(r.error));
  else if (d.page) window.open(d.page, "_blank", "noopener");
});
document.querySelectorAll("[data-nav]").forEach(b => (b.onclick = () => { view = b.dataset.nav; xren = null; draw(); }));
$("#theme").onclick = () => setTheme(!isDark());
try {
  const t = localStorage.getItem(KEY + ":theme"), c = JSON.parse(localStorage.getItem(KEY + ":charts") || "{}");
  // night first: the game window is dark and the app sits beside it; the Theme button remembers a change
  document.documentElement.dataset.theme = t === "dark" || t === "light" ? t : "dark";
  if (c.xk === "line") xkind = "line";
  xlog = !!c.xs;
} catch (e) {}
draw();
if (LOCAL) appPull();
</script>
