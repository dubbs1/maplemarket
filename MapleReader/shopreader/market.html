<title>Maple Market</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one work column for a trader at the Free Market — sticky tab bar, listings kept as a ruled ledger, prices in tabular figures */
:root{
  --bg:#f4f5f7;--card:#ffffff;--sf:#f9fafb;--tx:#111827;--mu:#5f6b7a;--bd:#e5e7eb;
  --ac:#2563eb;--acbg:#dbeafe;--sky:#2563eb;--skybg:#dbeafe;--onsky:#ffffff;--ok:#15803d;--bad:#b91c1c;
  --display:Inter,ui-sans-serif,system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1822;--card:#15212d;--sf:#1a2836;--tx:#e3ebf3;
  --mu:#91a3b5;--bd:#253646;--ac:#f0b54a;--acbg:#352812;--sky:#6db2ec;--skybg:#14283b;--onsky:#0e1822;--ok:#5fcf8d;
  --bad:#f08a80;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1822;--card:#15212d;--sf:#1a2836;--tx:#e3ebf3;--mu:#91a3b5;--bd:#253646;--ac:#f0b54a;
  --acbg:#352812;--sky:#6db2ec;--skybg:#14283b;--onsky:#0e1822;--ok:#5fcf8d;--bad:#f08a80;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:720px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:22px;line-height:1.15}h2{font-size:17px}
.num{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand p{margin:2px 0 0;color:var(--mu);font-size:13px}
.note{background:var(--acbg);color:var(--tx);border-radius:8px;padding:6px 6px 6px 12px;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}
.note b{color:var(--ac)}
.lv{font-size:11px;vertical-align:1px}.lv.on{color:var(--ok)}.lv.off{color:var(--bad)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;margin:0 0 16px;padding:4px;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow-x:auto}
nav button{flex:1 0 auto;border:0;background:transparent;color:var(--mu);font-weight:500;font-size:14px;padding:8px 10px;min-height:38px;border-radius:8px}
nav button:hover{color:var(--tx);background:var(--sf)}
nav button[aria-current=page]{background:var(--skybg);color:var(--sky);font-weight:600}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer}
button:hover{border-color:var(--sky)}
#pgo,#scgo,#log,#ago,#bulkgo{background:var(--sky);border-color:var(--sky);color:var(--onsky);font-weight:600}
#pgo:hover,#scgo:hover,#log:hover,#ago:hover,#bulkgo:hover{filter:brightness(1.08)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-height:40px;width:100%;box-sizing:border-box}
input::placeholder,textarea::placeholder{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
details.card>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";font-family:var(--mono);color:var(--mu);font-size:18px;line-height:1}
details.card[open]>summary::after{content:"\2212"}
details.card[open]>summary{margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:8px}
button.row{padding:12px 14px;border-radius:10px}
.row>span,.row>b{min-width:0}
.mu{color:var(--mu);font-size:13px}.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.m{background:var(--sf);border-radius:8px;padding:10px 12px}.m .num{font-size:21px}
.badge{display:inline-block;background:var(--ok);color:var(--card);border-radius:5px;padding:1px 7px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;vertical-align:1px}
.b2{background:var(--ac)!important}.b3{background:var(--mu)!important}
.sight{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}
.sight>span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.frm{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.frm>*{flex:1 1 120px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:4px 0 0}
a{color:var(--sky)}
#app:focus{outline:none}
.note button{min-height:30px;padding:2px 12px;font-size:12px;font-weight:600}
#theme{min-height:34px;padding:4px 12px;font-size:13px;color:var(--mu)}
/* Market list: one ruled ledger instead of a stack of boxes */
#mb{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
#mb:empty{display:none}
#mb>p{margin:0!important;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--bd);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
#mb>h2{margin:0!important;padding:12px 14px 8px;background:var(--sf);border-bottom:1px solid var(--bd);font-size:15px}
#mb>.card{border:0;border-bottom:1px solid var(--bd);border-radius:0;margin:0;padding:12px 14px}
#mb>.card:last-child{border-bottom:0}
#mb>.card .row{margin:0!important}
#mb>.card .num{font-size:17px!important}
#mb button[data-open],#app .card>.row>button[data-open]{color:var(--tx);font-weight:600;font-size:15px}
#mb button[data-open]:hover{color:var(--sky);text-decoration:underline}
#mb [data-wh],#mb [data-sold],#mb [data-rm]{min-height:32px;padding:4px 10px;font-size:13px}
.ins-sum{margin:0;font-size:15px}.ins-sum b{font-family:var(--mono);font-weight:500}
.ins-h{font-size:15px;margin:16px 0 8px}
.tod{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tod-t{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;background:var(--sf);min-width:0}
.tod-n{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.tod-t .num{font-size:15px;font-weight:600}
.tod-t.best-buy{border:2px solid var(--ok)}.tod-t.best-sell{border:2px solid var(--ac)}.tod-t.best-buy.best-sell{border-color:var(--ok);outline:2px solid var(--ac);outline-offset:1px}
.ins-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 8px}
.seg{display:flex;gap:4px}.seg button{min-height:32px;padding:4px 12px;font-size:13px;border-radius:999px}
.seg button[aria-pressed=true]{background:var(--tx);color:var(--card);border-color:var(--tx)}
.tbl{overflow-x:auto;border:1px solid var(--bd);border-radius:8px}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:600;padding:8px 10px;background:var(--sf);border-bottom:1px solid var(--bd)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}.tbl .r{text-align:right}
.chip{display:inline-block;border-radius:5px;padding:1px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.c-sale{background:var(--skybg);color:var(--sky)}.c-sold{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.c-gone{background:var(--sf);color:var(--mu)}
.fresh{color:var(--ok);font-weight:600;white-space:nowrap}
@media(max-width:480px){.tod{grid-template-columns:repeat(2,minmax(0,1fr))}}
.foot{margin-top:24px;font-size:12px;color:var(--mu);max-width:65ch}
@media(max-width:480px){.grid{grid-template-columns:minmax(0,1fr)}h1{font-size:20px}nav button{padding:8px 8px;font-size:13px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s,color .15s}}
/* App mode (opened from MapleReader): wider window, clean header with a live status chip, item pictures */
html.app #app.narrow{max-width:820px}
@media(max-width:560px){.brand p{display:none}.top{align-items:flex-start}}
html.app .note{display:none}
html.app #app.narrow{margin-inline:auto}
.hr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.lchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mu);white-space:nowrap}
.lchip i{width:8px;height:8px;border-radius:50%;background:var(--mu);flex:none}
.lchip.on i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.lchip.on{color:var(--tx)}.lchip.off i{background:var(--bad)}
.ic{width:34px;height:34px;border-radius:8px;object-fit:contain;image-rendering:pixelated;background:#ecebe6;border:1px solid var(--bd);flex:none;vertical-align:middle}
.ic.lg{width:56px;height:56px;border-radius:12px}
.nm{display:flex;align-items:center;gap:10px;min-width:0}
.nm>button{min-width:0;overflow:hidden;text-overflow:ellipsis}
/* Scanner tab */
.scan{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:860px){.scan{grid-template-columns:minmax(0,1fr)}}
.scan .card{margin:0 0 16px}
.go{width:100%;min-height:54px;border-radius:12px;font-size:17px;font-weight:700;font-family:var(--display);background:var(--ac);border-color:var(--ac);color:var(--card)}
.go:hover{filter:brightness(1.06);border-color:var(--ac)}
.go.stop{background:var(--sf);border-color:var(--bd);color:var(--tx)}
.st{margin:10px 0 0;font-size:14px;color:var(--mu);display:flex;align-items:center;gap:8px}
.st i{width:9px;height:9px;border-radius:50%;background:var(--mu);flex:none}
.st.on i{background:var(--ok)}.st.wait i{background:var(--ac)}.st.bad i{background:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sf);border-radius:10px;padding:10px 12px;min-width:0}
.tile .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);font-weight:600}
.tile .v{font-family:var(--mono);font-size:26px;font-weight:500;line-height:1.2;margin:2px 0 6px}
.tile .v.gold{color:var(--ac)}
.fix{display:flex;gap:6px}.fix input{min-height:34px;padding:4px 8px;font-size:13px}.fix button{min-height:34px;padding:4px 10px;font-size:13px;flex:none}
.sec{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);font-weight:600;margin:0 0 10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}
.opt:first-of-type{border-top:0}
.opt input[type=range]{width:150px;min-height:0;padding:0;border:0;background:none;accent-color:var(--ac)}
.opt select{width:auto;min-height:34px;padding:4px 8px}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;min-height:0;z-index:1;width:100%;height:100%}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--bd);transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--card);transition:transform .15s}
.sw input:checked+span{background:var(--ac)}.sw input:checked+span::after{transform:translateX(18px)}
.sw input:focus-visible+span{outline:2px solid var(--sky);outline-offset:2px}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.btns label.bt{display:flex;align-items:center;justify-content:center;border:1px solid var(--bd);border-radius:8px;min-height:40px;cursor:pointer;background:var(--card);font-size:14px}
.btns label.bt:hover{border-color:var(--sky)}
.btns label.bt input{display:none}
.btns button{font-size:14px}
.btns a.bt{display:flex;align-items:center;justify-content:center;border:1px solid var(--bd);border-radius:8px;min-height:40px;
  background:var(--card);font-size:14px;color:var(--tx);text-decoration:none}
.btns a.bt:hover{border-color:var(--sky)}
.shf{display:grid;gap:6px;margin-top:8px}.shf label{margin-top:4px}
.feedh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 10px}
.feed{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.fr{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd)}
.fr:last-child{border-bottom:0}
.fr .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .s{font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .p{text-align:right}.fr .p .num{font-size:16px}.fr .p .mu{font-size:12px}
.fr.sold .t,.fr.sold .num{color:var(--mu)}
.fr.new{background:color-mix(in srgb,var(--ok) 7%,transparent)}
.fr.new .when{color:var(--ok);font-weight:600}
.ph{width:34px;height:34px;border-radius:8px;background:var(--sf);border:1px solid var(--bd)}
.empty{padding:28px 16px;text-align:center;color:var(--mu)}
.notes{margin:0;padding:0;list-style:none;font-size:13px}
.notes li{padding:6px 0;border-top:1px solid var(--bd);color:var(--mu);display:flex;gap:8px}
.notes li:first-child{border-top:0}.notes li b{font-family:var(--mono);font-weight:500;flex:none}
.notes li.warn{color:var(--ac)}.notes li.error{color:var(--bad)}
.shopnow{font-family:var(--display);font-size:18px;font-weight:700;margin:0;overflow-wrap:anywhere}
/* The app's simple views */
[hidden]{display:none!important}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
button.fr{width:100%;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:none;text-align:left;min-height:0;color:var(--tx)}
button.fr:hover{background:var(--sf);border-color:var(--bd)}
button.fr:last-child{border-bottom:0}
#mb>.card.fr{display:grid;padding:10px 14px}
.lk{border:0;padding:0;min-height:0;background:none;text-align:left;max-width:100%;display:block}
.lk:hover{color:var(--sky);text-decoration:underline}
.fr.nopic{grid-template-columns:minmax(0,1fr) auto}
.cnt{font-size:13px;color:var(--mu)}
#live{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;margin:0;max-width:min(560px,calc(100vw - 32px));box-sizing:border-box;
  background:var(--tx);color:var(--card);border-radius:10px;padding:10px 16px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#live:empty{display:none}
.more-old{display:block;width:100%;border:0;border-top:1px solid var(--bd);border-radius:0;background:var(--sf);color:var(--mu);font-size:13px}
.back{min-height:34px;padding:4px 12px;font-size:13px;margin-bottom:12px}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:12px}
@media(max-width:560px){.tiles.t3{grid-template-columns:minmax(0,1fr)}}
.nm h2{font-size:20px}
.chg{min-height:28px;padding:2px 10px;font-size:12px}
.steps{margin:12px 0 0;padding:0;list-style:none;counter-reset:s;font-size:14px}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--bd)}
.steps li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--sf);border:1px solid var(--bd);
  display:grid;place-items:center;font-size:12px;font-weight:600}
.steps li.done{color:var(--mu)}
.steps li.done::before{content:"✓";background:var(--ok);border-color:var(--ok);color:var(--card)}
#sets[open]>summary{margin-bottom:4px}
/* Scan tab: fits the app window (about 860 px tall) without scrolling */
.strip{margin-bottom:12px;padding:10px}
.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:700px){.tiles.t4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.strip .tile{padding:8px 12px}.strip .tile .v{font-size:22px;margin:0 0 4px}.strip .shopnow{font-size:16px}
.scan .card{margin:0 0 12px;padding:12px 14px}
.scan .go{min-height:46px;font-size:16px}
.scan .st{margin-top:8px}
.scan .steps{margin-top:8px;font-size:13px}.scan .steps li{padding:4px 0}
.xh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:8px}
.xl{font-family:var(--mono);font-size:24px;font-weight:500}
.xbar{height:8px;border-radius:99px;background:var(--sf);overflow:hidden;margin:6px 0 10px}
.xbar i{display:block;height:100%;background:#7fa32a;border-radius:99px}
.xs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.xs .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);font-weight:600}
.xs .num{font-size:16px}.xs .num.gold{color:var(--ac)}.xs .mu{font-size:12px}
#notes{max-height:96px;overflow-y:auto}
.msgs{margin-bottom:12px;padding:10px 14px}.msgs .sec{margin-bottom:4px}
.strip .tile{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;align-items:center}
.strip .tile>.k,.strip .tile>.fix,.strip .tile>.mu{grid-column:1/-1}
.strip .tile>.chg{align-self:center}
.upd{border:2px solid var(--ac)}
/* Prices: one big search, item cards, and the chosen item's details beside them */
.pgrid{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.cards{flex:2 1 420px;min-width:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.cards>.empty{grid-column:1/-1;background:var(--card);border:1px solid var(--bd);border-radius:12px}
.pc{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:14px;border-radius:12px;border:2px solid var(--bd);background:var(--card);
  text-align:left;min-height:0;width:100%;color:var(--tx)}
.pc[aria-pressed=true]{border-color:var(--ac)}.pc:hover{border-color:var(--sky)}
.pc>span{display:block;min-width:0}.pc>.nm{display:flex;margin-bottom:6px}
.pc .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .k,.oc .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);font-weight:600}
.pc .num{font-size:22px}
#ipanel{flex:1 1 300px;min-width:0;margin:0}
@media(max-width:560px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pc{padding:10px}.pc .num{font-size:18px}
  }
#ipanel .ins-h{margin-top:14px}
#ipanel .feed .fr{padding:8px 12px}
/* Listings as cards (Compact is the ruled list above) */
/* Options: every setting is a card with its switch */
.oh2{margin:4px 0 10px}
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:20px}
.oc{margin:0;display:flex;flex-direction:column;gap:8px}
.oc p{margin:0}
.oc .oh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.oc .oh label:first-child{cursor:pointer}
.oc input[type=range]{min-height:0;padding:0;border:0;background:none;accent-color:var(--ac)}
.oc select{width:auto;align-self:flex-start}

  }
  const sg = {};
  ITEMS.forEach((it, i) => {
    const r = rng(i + 11),

// Live pages keep 30 days; if the browser's storage is still full, the oldest scans make room
function saveRoom() {

  while (S.scans.length) {
    if (S.scans.length > 1) S.scans.splice(0, Math.ceil(S.scans.length / 10));
    else {
      // one long session (the group's feed joins everyone's rows): drop its oldest tenth
      const rows = S.scans[0].rows.sort((a, b) => (a.t || 0) - (b.t || 0));
      if (rows.length < 10) return false;
      rows.splice(0, Math.ceil(rows.length / 10));

    // Timed rows come from MapleReader, which writes "gone" lines itself, and only after seeing the shop's whole list.

      const o = m[k];

    });

        .forEach(k => extra-- > 0 && (m[k].st = "gone"));

    .forEach(ln => {
      if (!ln.trim() || ln.trim().startsWith("#")) return;
      const p = ln.split("|").map(x => x.trim()),
        pr = parsePrice(p[1]),

        ch = +p[4],

        qt = ex.map(x => x.replace(/^x/i, "")).find(x => /^\d+$/.test(x)),
        ps = ex.find(x => /^#\d+$/.test(x)),

function parsePrice(v) {

let NAME_IDX = null;
function itemByName(name) {

function addItem(name, cat, ns, scanned) {

    .replace(/\s+/g, " ");
  cat =
    String(cat || "")
      .trim()
      .slice(0, 24) || "Other";
  if (!name || name.length > 60) return null;
  const ex = itemByName(name);
  if (ex) return { dup: 1, it: ex };
  const it = { id: "c" + Date.now().toString(36) + ITEMS.length, name, cat, base: 0 };
  if (!scanned) it.typed = 1; // a name someone typed: never "fixed" like a misread (tidyNames)
  ITEMS.push(it);

function addItems(text) {

  const line = hkind === "line",
    M = B.map(b => median(b)),
    Lo = B.map(b => (b.length ? Math.min(...b) : null)), // the cheapest and dearest each day: the lines
    Hi = B.map(b => (b.length ? Math.max(...b) : null)),
    cnt = B.map(b => b.length),

      `width="${(w - 4).toFixed(1)}" height="${((c / mc) * 30).toFixed(1)}" rx="2"/>` : "")).join(""),
    P = path(M),
    extra = line ? [Lo, Hi].map(A => `<polyline class="hx" points="${path(A).map(p => p.join(",")).join(" ")}"/>`).join("") : "",
    last = V[V.length - 1],
    lp = P[P.length - 1];

    `<div class="legend"><span><i></i>Median price</span>${line ? '<span><i class="x"></i>Cheapest and dearest</span>' : '<span><i class="b"></i>Listings seen</span>'}` +
    `${hlog ? '<span class="mu">log scale</span>' : ""}</div>` +
    `<svg viewBox="0 0 300 100" role="img" aria-label="Median price over the last ${hdays} days: from ${fmt(lo)} to ${fmt(hi)}, now ${fmt(last)}">` +
    `${bars}${extra}<polyline class="hl" points="${P.map(p => p.join(",")).join(" ")}"/>` +
    `${line ? P.map(p => `<circle class="hd" cx="${p[0]}" cy="${p[1]}" r="2.5"/>`).join("") : ""}<circle class="hd" cx="${lp[0]}" cy="${lp[1]}" r="3.5"/></svg>` +
    `<div class="ax"><span>${hdays} days ago</span><span>${fmt(lo)} – ${fmt(hi)}</span><span>latest ${fmt(last)}</span></div></div>`;
}
// Trending: items whose cheapest price now is well off their usual price (and the market's mood, over every item)
function movers() {
  analyze();

  if (movers.key === key) return movers.v;
  const all = [];
  Object.entries(AC.by).forEach(([id, R]) => {
    const it = item(id),
      live = forSale(R);
    if (!it || !live.length) return;
    const s = stats(id);
    if (s.usual == null || s.list.length < 3) return;
    const low = Math.min(...live.map(o => o.price));
    all.push({ id, it, low, pct: Math.round((low / s.usual - 1) * 100) });
  });

  return (movers.v = {
    top: all.filter(m => Math.abs(m.pct) >= 5).sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct)).slice(0, 10),
    mood: all.length >= 3 ? median(all.map(m => m.pct)) : null

}

// One feed of scan rows: this PC's all_scans.txt ("/api/rows"), or, in the app with sharing on,
// the group's listings ("/api/shared/rows"). Each keeps its own place so nothing is read twice.
function puller(path, offKey, isMain) {
  const get = () => {
      try {
        return +localStorage.getItem(offKey) || 0;
      } catch (e) {
        return 0;
      }
    },
    put = n => {
      try {
        localStorage.setItem(offKey, String(n));
      } catch (e) {}
    };
  let off = get();
  // this PC's own file: every 2 s. The group's market runs on a free plan: every 20 s is plenty (the app's own
  // scans show at once anyway; a friend's appear within half a minute)
  const EVERY = MODE === "local" && isMain ? 2000 : 20000;
  const pull = async () => {
    let wait = EVERY;
    if (isMain && Date.now() - PRUNED > 3600e3) (PRUNED = Date.now()), pruneOld(); // the window stays open for days
    try {
      const r = await fetch(path + "?from=" + off, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      if (j.configured === false) {
        setTimeout(pull, 10000); // sharing is off in the app: look again later
        return;
      }
      if (isMain) {
        liveOk = true;
        liveStatus = j.status;
      } else FRIENDS = j.status || FRIENDS;
      if (j.reset) off = 0;
      if (j.text) {
        const before = alertHits().map(K),
          res = importScan(j.text, true);
        if (res.added) {
          liveAdded += res.added;
          liveLast = newestRow() || Date.now();
          const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
          if (!cur && !typing) refreshList();
          const nh = alertHits().filter(o => !before.includes(K(o)));
          if (nh.length) {
            say(`Alert: ${nh.length} new match${nh.length > 1 ? "es" : ""}. ${SEE_DEALS}`);
            beep();
          }
        }
        if (res.full) say("Storage is full: new listings can't be kept. Press Reload all.");
      }
      off = j.next;
      put(off);
      if (j.more) wait = 50; // a lot waiting: keep going straight away
    } catch (e) {
      if (isMain) liveOk = false;
    }
    if (isMain) liveBanner();
    setTimeout(pull, wait);
  };
  return { pull, reset: () => (off = 0) };
}

    if (!r.ok) say(r.error || "Could not start.");
    if (!on && r.ok) {
      APP.feed = [];
      drawFeed();
    }
  };
  const fix = (inp, key, max) => async () => {
    const v = +$(inp).value;
    if (!(v >= 1 && v <= max)) return say(`Type a number from 1 to ${max}.`);
    const r = await api("/api/set", { [key]: v });
    if (!r.ok) return say(r.error);
    $(inp).value = "";
    $(inp).parentNode.hidden = true;
    const c = $(`[data-chg="${key === "channel" ? "ch" : "rm"}"]`);
    if (c) c.textContent = "Change";
    say(`${key === "channel" ? "Channel" : "Room"} set to ${v}`);
  };
  $("#sch").onclick = fix("#ich", "channel", 40);
  $("#srm").onclick = fix("#irm", "room", 40);
  $("#ich").onkeydown = e => e.key === "Enter" && $("#sch").click();
  $("#irm").onkeydown = e => e.key === "Enter" && $("#srm").click();
  document.querySelectorAll("[data-chg]").forEach(b => (b.onclick = () => {
    const f = $("#f" + b.dataset.chg);
    f.hidden = !f.hidden;
    b.textContent = f.hidden ? "Change" : "Cancel";
    if (!f.hidden) $("#i" + b.dataset.chg).focus();
  }));
  $("#expreset").onclick = async () => {
    await api("/api/exp-reset");
    say("EXP tracking starts again from now");
  };
  $("#expgo").onclick = async () => {
    const r = await api("/api/set", { exp: !(APP.st && APP.st.exp_on) });
    if (!r.ok) say(r.error || "Could not change EXP recording.");
  };
  $("#upd").onclick = async e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.page) return void window.open(b.dataset.page, "_blank", "noopener");
    const r = await api("/api/update");
    if (!r.ok) say(r.error);
  };
  updScan(true);
}
// The Options tab's settings: each sends its change to MapleReader straight away
function bindSettings() {
  $("#oq").onchange = e => api("/api/set", { quiet: !e.target.checked });
  $("#oa").onchange = e => api("/api/set", { auto_start: e.target.checked });
  $("#ox").onchange = e => api("/api/set", { exp: e.target.checked });
  $("#ov").onchange = e => api("/api/set", { volume: +e.target.value });
  $("#om").onchange = e => api("/api/set", { monitor: +e.target.value });
  $("#oscans").onclick = () => api("/api/open-scans");
  $("#updcheck").onclick = async () => {
    $("#updline").textContent = "Checking for updates…";
    await api("/api/update-check");
  };
  if ($("#shon")) $("#shon").onchange = async e => {
    const r = await api("/api/set", { share_on: e.target.checked });
    if (!r.ok) {
      e.target.checked = false;
      say(r.error);
      $("#shk").focus();
    }
  };
  if ($("#shsave")) $("#shsave").onclick = async () => {
    const r = await api("/api/set", { share_server: $("#shsv").value, share_key: $("#shk").value, share_on: true });
    if (!r.ok) return say(r.error);
    $("#shk").value = "";
    $("#shon").checked = true;
    say("Sharing settings saved");
  };
  $("#opic").onchange = async e => {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    say("Reading " + f.name + "…");
    const r = await api("/api/picture", await f.arrayBuffer(), true);
    if (!r.ok) return say(r.error);
    APP.notes.unshift({ kind: "note", level: "info", t: Date.now() / 1000,
      text: `${f.name}: ${r.rows.length} listing${r.rows.length === 1 ? "" : "s"}` +
        `${r.rows.length ? " (" + r.rows.slice(0, 3).map(x => x.item).join(", ") + (r.rows.length > 3 ? "…" : "") + ")" : ""}, ` +
        `room ${r.room || "not found"}${r.channel ? `, channel window shows ${r.channel}` : ""}` });
    say(APP.notes[0].text + " (also under Messages on Scan)");
    updScan(false);
  };
  updOpts(APP.st || {});
}
function updOpts(st) {
  drawUpdLine(st.update || {});
  const sh = st.share || {},
    shText = !sh.enabled
      ? ["", "Off."]
      : sh.state === "ok"
        ? ["on", `Sharing${sh.who ? " as " + sh.who : ""} · ${(sh.sent || 0).toLocaleString()} sent` +
            (sh.last_ok ? ` · checked ${ago(Date.now() - sh.last_ok * 1000).replace("1 min ago", "just now")}` : "")]
        : sh.state === "starting"
          ? ["wait", "Connecting…"]
          : sh.state === "offline" || sh.state === "retrying"
            ? ["wait", sh.error || "Trying again shortly."]
            : ["bad", sh.error || "Type your key and press Save."];
  if ($("#shst")) {
    $("#shst").className = "st " + shText[0];
    $("#shst span").textContent = shText[1];
  }
  if (sh.server && $("#shopen")) $("#shopen").href = sh.server;
  if ($("#eng")) $("#eng").textContent = !st.tesseract ? "" : st.engine === "fast" ? `MapleReader ${st.version} · fast reading` : `MapleReader ${st.version} · standard reading`;
}
function drawFeed() {
  const f = $("#feed");
  if (!f) return;
  const now = Date.now();
  $("#fcount").textContent = APP.feed.length ? `${APP.feed.length} listing${APP.feed.length === 1 ? "" : "s"}` : "";
  f.innerHTML = APP.feed.length
    ? APP.feed
        .slice(0, 200)
        .map(x => {
          const fresh = now - x.t * 1000 < JUST;
          return `<div class="fr${x.sold ? " sold" : ""}${fresh ? " new" : ""}">` +
            (ICONS.has(x.icon) ? `<img class="ic" src="/icons/${esc(x.icon)}.png" alt="">` : `<span class="ph"></span>`) +
            `<div style="min-width:0"><div class="t">${esc(x.item)}</div><div class="s">${esc(x.shop)} · FM ${x.room || "?"} · CH ${x.ch}</div></div>` +
            `<div class="p"><div class="num">${fmt(x.each)}</div><div class="mu">${x.sold ? '<span class="chip c-sold">sold</span> ' : ""}` +
            `<span class="when">${fresh ? (x.sold ? "just now" : "just listed") : ago(now - x.t * 1000)}</span></div></div></div>`;
        })
        .join("")
    : `<div class="empty">Nothing saved yet. Press Start, then open shops.</div>`;
}
// The EXP card: level, EXP per hour, gained, time to the next level (numbers from ExpTracker.summary in exp.py)
function drawExp(x, on, found) {
  const go = $("#expgo");
  if (go) {
    go.textContent = on ? "Stop" : "Start";
    go.setAttribute("aria-label", on ? "Stop recording EXP" : "Start recording EXP");
  }
  const t = $("#expt");
  if (!t) return;
  // compact: the level and a bar on one line, then three small figures side by side
  const fig = (k, v, sub, cls) => `<div><div class="k">${k}</div><div class="num${cls ? " " + cls : ""}">${v}</div><div class="mu">${sub}</div></div>`;
  const html = !x ? "" :
    `<div class="xh"><span class="xl">Lv. ${x.level || "—"}</span><span class="mu">${x.pct.toFixed(2)}% · ${fmt(x.exp)} EXP</span></div>` +
    `<div class="xbar" aria-hidden="true"><i style="width:${Math.max(0, Math.min(100, x.pct))}%"></i></div><div class="xs">` +
    fig("Per hour", x.per_hour == null ? "…" : fmt(x.per_hour), x.pct_per_hour == null ? "after a minute" : `${x.pct_per_hour}%/h`, "gold") +
    fig("Gained", fmt(x.gained), `in ${x.minutes} min${x.levels ? ` · ${x.levels} up` : ""}`) +
    fig("Next level", x.eta_text || "—", x.left == null ? "" : `${fmt(x.left)} to go`) + `</div>`;
  if (t.dataset.html !== html) t.innerHTML = t.dataset.html = html;
  t.hidden = !x;
  $("#expn").hidden = !!x && on && !x.lost;        // (only when there's something to say: keeps the card short)
  $("#expn").textContent = !on
    ? (x ? "EXP recording is stopped. " : "") + "Press Start to record EXP."
    : x ? (x.lost ? `Lost ${fmt(x.lost)} EXP (from dying).` : "")
      : found ? "Reading your EXP…" : "Looking for the EXP line. Keep the status bar visible.";
}
// A newer MapleReader: a card at the top of Scan (only when there's something to do) and a line in Settings
function drawUpdate(u, lost) {
  drawUpdLine(u);
  const card = $("#upd");
  if (!card) return;
  const v = esc(u.version || ""),
    busy = u.state === "downloading" || u.state === "installing";
  card.hidden = lost || !(u.state === "available" || busy);
  const html = busy
    ? `<b>Updating to ${v}…</b><p class="mu" style="margin:4px 0 0">${u.state === "downloading" ? "Downloading the new version." :
      "Installing. MapleReader restarts by itself."}</p>`
    : u.state === "available"
      ? `<div class="row" style="margin:0"><span><b>A new version is ready</b><br><span class="mu">MapleReader ${v}` +
        `${u.error ? ` · <span class="dn">${esc(u.error)}</span>` : ""}</span></span>` +
        (u.can_install ? `<button class="go" style="width:auto;min-height:44px;font-size:15px;padding:0 18px">Update now</button>` :
          `<button data-page="${esc(u.page || "")}">Download page</button>`) + `</div>`
      : "";
  if (card.dataset.html !== html) card.innerHTML = card.dataset.html = html; // don't redraw (and lose a click) every second
}
function drawUpdLine(u) {
  const line = $("#updline");
  if (line) line.textContent = {
    none: "Updates: you have the newest version",
    available: `Updates: ${u.version} is ready (see the top of the Scan tab)`,
    downloading: "Updates: downloading…",
    installing: "Updates: installing…",
    checking: "Updates: checking…",
    offline: "Updates: can't reach GitHub right now",
    unavailable: "Updates: no public release to check yet",
    off: "Updates: switched off"
  }[u.state] || "Updates";
}
function updScan(feedChanged, lost) {
  const st = APP.st || {};
  if (!$("#go")) return;
  const on = !lost && st.watching;
  $("#go").textContent = !st.tesseract && !lost ? "Install Tesseract (the text reader)" : on ? "Stop" : "Start watching";
  $("#go").className = "go" + (on ? " stop" : "");
  const [cls, text] = lost
    ? ["bad", "MapleReader has closed."]
    : !st.tesseract
      ? ["bad", "Tesseract is needed to read shops. Press the button above to install it."]
      : STATUS[on ? st.status : "stopped"] || STATUS.looking;
  $("#sst").className = "st " + cls;
  $("#sst span").textContent = text;
  drawUpdate(st.update || {}, lost);
  // the three steps tick themselves off, and go away once the first listing is saved
  $("#steps").hidden = (st.total || 0) > 0 || lost;
  $("#steps").innerHTML = [
    [on, "Press <b>Start watching</b>."],
    [!!st.channel, "Open the <b>Change Channel</b> window once."],
    [(st.total || 0) > 0, "Open any shop. Its listings are saved."]
  ].map(([d, t]) => `<li class="${d ? "done" : ""}"><span>${t}</span></li>`).join("");
  $("#vch").textContent = st.channel || "—";
  $("#vrm").textContent = st.room || "—";
  $("#vtot").textContent = st.total || 0;
  $("#vrun").textContent = on && st.started ? `this session · ${Math.max(0, Math.floor(Date.now() / 6e4 - st.started / 60))} min` : "this session";
  $("#vshop").textContent = on && st.shop ? st.shop : "—";
  drawExp(st.exp, !lost && st.exp_on, st.exp_found);
  $("#vrows").textContent = on && st.shop ? `${st.shop_rows} listing${st.shop_rows === 1 ? "" : "s"} read · scroll with the wheel for more` : "";
  updOpts(st);
  $("#notes").innerHTML = APP.notes.length
    ? APP.notes
        .map(n => `<li class="${n.level || ""}"><b>${new Date((n.t || 0) * 1000).toTimeString().slice(0, 5)}</b><span>${esc(n.text)}</span></li>`)
        .join("")
    : `<li>Ready.</li>`;
  // redraw the list when something new arrived, and every 30 s so "just listed" and the ages stay right
  if (feedChanged || !$("#feed").children.length || Date.now() - (APP.drawn || 0) > 30000) {
    APP.drawn = Date.now();
    drawFeed();
  }
}
if (MODE === "local") appPull(true); // after APP above exists

window.App = {
  deals,
  importFiles,
  addAlert,
  alertHits,
  analyze,
  importScan,
  addListing,
  markSold,
  removeListing,
  addItem,
  addItems,
  ITEMS,
  stats,
  search,
  addSighting,
  median,
  get S() {
    return S;
  }
};
</script>
