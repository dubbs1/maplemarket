<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Sapline</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Sapline look: a left menu, one status card, cards that never touch, numbers in tabular figures.
   Every colour is a token on :root. Night is a cool slate; gold is kept for EXP numbers and the active menu item.
   The night set is under prefers-color-scheme and data-theme=dark. Original artwork only. */
:root{
  --bg:#f3f5f8;--side:#eceff3;--card:#ffffff;--sf:#eef1f5;--tx:#1b2330;--mu:#5b6778;--bd:#d9dfe7;
  --acbg:#e3ebf7;--acbd:#c5d2e4;--gold:#9a6700;--ok:#1f8a4c;--bad:#c23b32;--warn:#9a6700;
  --shadow:0 1px 2px rgba(20,30,45,.05),0 8px 20px -14px rgba(20,30,45,.25);
  --display:Nunito,ui-rounded,ui-sans-serif,system-ui,sans-serif;
  --body:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1216;--side:#12161c;--card:#171c23;--sf:#12161c;--tx:#eef2f7;--mu:#8e9aab;--bd:#28303b;
  --acbg:#243041;--acbd:#3a4759;--gold:#f3c553;--ok:#5fcf86;--bad:#f0817a;--warn:#f3c553;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 24px -16px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1216;--side:#12161c;--card:#171c23;--sf:#12161c;--tx:#eef2f7;--mu:#8e9aab;--bd:#28303b;
  --acbg:#243041;--acbd:#3a4759;--gold:#f3c553;--ok:#5fcf86;--bad:#f0817a;--warn:#f3c553;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 24px -16px rgba(0,0,0,.6);color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;letter-spacing:-.01em}
h1{font-size:24px;line-height:1.15}h2{font-size:16px}
b{font-weight:800}
.num{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;margin:0}
.mu{color:var(--mu);font-size:13px}.up{color:var(--ok)}.dn{color:var(--bad)}.gold{color:var(--gold)}.warnc{color:var(--warn)}
/* ---- the shell: menu on the left, the page on the right ---- */
.shell{height:100vh;display:flex}
.side{flex:none;width:212px;box-sizing:border-box;padding:22px 14px 18px;display:flex;flex-direction:column;gap:6px;background:var(--side);border-right:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand b{font-family:var(--display);font-size:19px}
.side nav{display:flex;flex-direction:column;gap:6px}
.side nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--tx);
  font-weight:700;font-size:15px;text-align:left;box-shadow:none;width:100%}
.side nav button:hover{background:var(--card);color:var(--tx)}
.side nav button[aria-current=page]{background:var(--acbg);color:var(--gold);font-weight:800}
.side nav svg{width:20px;height:20px;flex:none}
.side .sp{flex:1}
.status{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.lchip{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--mu)}
.lchip i{width:10px;height:10px;border-radius:50%;background:var(--mu);flex:none}
.lchip.on{color:var(--ok)}.lchip.on i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.lchip.wait{color:var(--warn)}.lchip.wait i{background:var(--warn)}
.lchip.off{color:var(--bad)}.lchip.off i{background:var(--bad)}
#chipsub{margin:0;line-height:1.4}
.xctl{display:flex;flex-direction:column;gap:8px}
main{flex:1;min-width:0;height:100vh;box-sizing:border-box;display:flex;flex-direction:column}
#app{flex:1;min-height:0;overflow:auto;padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px}
#app:focus{outline:none}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph p{margin:4px 0 0;color:var(--mu);font-size:14px}
.pa{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media(max-width:760px){
  .shell{flex-direction:column;height:auto}
  .side{width:auto;border-right:0;border-bottom:1px solid var(--bd);padding:12px 16px}
  .brand{padding-bottom:8px}
  .side nav{flex-direction:row;flex-wrap:wrap}.side nav button{width:auto;flex:1 1 auto;justify-content:center}
  main{height:auto}#app{overflow:visible;padding:16px}
}
/* ---- controls ---- */
button,input,select{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:0 14px;min-height:40px;cursor:pointer;font-weight:700;font-size:14px}
button:hover{border-color:var(--acbd);background:var(--sf)}
.go{background:var(--acbg);border:1px solid var(--acbd);color:var(--tx);font-weight:800;min-height:44px;font-size:15px}
.go:hover{filter:brightness(1.08);background:var(--acbg)}
.pri{background:var(--acbg);border-color:var(--acbd);color:var(--gold);font-weight:800}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:0 12px;min-height:40px;width:100%;box-sizing:border-box}
input:focus,select:focus{border-color:var(--acbd);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 20%,transparent);outline:none}
input::placeholder{color:var(--mu)}
input[type=checkbox]{width:22px;height:22px;min-height:0;margin:0;padding:0;accent-color:var(--gold);flex:none;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:999px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;min-height:34px;padding:0 14px;font-size:13px;color:var(--mu)}
.seg button:hover{background:var(--sf);color:var(--tx)}
.seg button[aria-pressed=true]{background:var(--acbg);color:var(--gold);font-weight:800}
/* ---- cards and grids ---- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 20px;box-sizing:border-box;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.card>p{margin:0}
.g2,.g3,.g4{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.s2{grid-column:span 2}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.s2{grid-column:auto}}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}
.k{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.v{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.tile{padding:14px 16px;gap:4px}
.warm .v,.warm .big{opacity:.6}
.big{font-family:var(--mono);font-size:52px;font-weight:700;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.big+span,.bl{font-size:16px;color:var(--mu);font-weight:700}
.bline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.facts{display:flex;gap:22px;flex-wrap:wrap;font-size:14px}
.facts b{font-family:var(--mono);font-weight:700}
.hero{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:0;padding:18px 20px}.hero>div{display:flex;flex-direction:column;gap:6px;min-width:0}.hero>div+div{border-left:1px solid var(--bd);padding-left:22px;margin-left:22px}.hero>div>span:not(.k){font-size:15px}.hero .facts span,.hero .mu{font-size:14px}
@media(max-width:1000px){.hero{grid-template-columns:minmax(0,1fr)}.hero>div+div{border-left:0;padding-left:0;margin-left:0;border-top:1px solid var(--bd);padding-top:14px}}
.notes.line{padding:0 4px}.notes.line li{border:0;padding:0}
.xlv{display:flex;align-items:baseline;gap:10px}.xlv b{font-family:var(--mono);font-size:40px;font-weight:700;line-height:1}.xlv .num{font-size:18px;color:var(--mu)}
.xbar{height:10px;border-radius:999px;background:var(--sf);overflow:hidden;border:1px solid var(--bd)}
.xbar i{display:block;height:100%;background:var(--gold);border-radius:999px}
.list{display:flex;flex-direction:column}
.list>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd)}
.list>div:last-child{border-bottom:0;padding-bottom:0}
.list .num{font-weight:700}
.xchart{display:flex;align-items:flex-end;gap:10px;height:150px;padding:0 2px}
.xchart i{flex:1;border-radius:6px 6px 2px 2px;background:color-mix(in srgb,var(--gold) 45%,transparent);min-height:2px}
.xchart i:last-child{background:var(--gold)}
.xline{display:block;width:100%;height:150px;overflow:visible}.xline polyline{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linejoin:round}
.xline .xa{fill:color-mix(in srgb,var(--gold) 18%,transparent)}.xline circle{fill:var(--gold)}
.ax{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
.xopts{display:flex;gap:8px;flex-wrap:wrap}
.steps{display:flex;flex-direction:column;gap:16px}
.steps>div{display:flex;gap:14px;align-items:flex-start}
.steps i{width:36px;height:36px;flex:none;border-radius:50%;background:var(--acbg);color:var(--gold);display:inline-flex;align-items:center;justify-content:center;font:700 15px var(--mono)}
.steps span{color:var(--mu);font-size:14px;line-height:1.45}
.bar{border:2px solid var(--gold);background:var(--acbg);border-radius:8px;height:46px;display:flex;align-items:center;gap:12px;padding:0 14px;box-sizing:border-box;margin-top:auto}
.bar span{height:10px;border-radius:999px}
.sunk{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
/* ---- tables ---- */
.tcard{padding:6px 0 0;gap:0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:800;padding:12px 10px}
th:first-child,td:first-child{padding-left:18px}th:last-child,td:last-child{padding-right:18px}
td{padding:11px 10px;border-top:1px solid var(--bd);white-space:nowrap}
td.r,th.r{text-align:right}
tr.now td{color:var(--gold)}
td button{min-height:34px;padding:0 12px;font-size:13px;margin-left:6px;background:var(--sf)}td input{width:170px;min-height:34px;display:inline-block}
.tfoot{margin:0;padding:12px 18px;border-top:1px solid var(--bd)}
.tcard h2{padding:10px 18px 4px}
/* ---- mobs ---- */
.mob{flex-direction:row;gap:14px;padding:14px}
.mob .pic{width:96px;height:96px;flex:none;border-radius:10px;background:var(--sf);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;overflow:hidden}
.mob .pic img{max-width:92px;max-height:92px;object-fit:contain}.mob .pic svg{width:56px;height:56px;color:var(--mu)}
.mob .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.mob label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mu)}
.mob input.mn{min-height:38px;font-weight:700}
.mob .btns{display:flex;gap:6px;flex-wrap:wrap}.mob .btns button{min-height:34px;padding:0 12px;font-size:13px}
input.mn{min-height:34px}
/* ---- settings ---- */
.opt{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0}
.opt+.opt{border-top:1px solid var(--bd)}.opt:last-child{padding-bottom:0}
.opt>label:first-child,.opt>span:first-child{min-width:0}label.opt,.opt label{cursor:pointer}.opt b{display:block}.opt .mu{display:block}
.opt select{width:auto;flex:none}.opt button{flex:none}
.upd{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--card))}
.notes{margin:0;padding:0;list-style:none;font-size:13px}
.notes li{padding:6px 0;border-top:1px solid var(--bd);color:var(--mu);display:flex;gap:8px}
.notes li:first-child{border-top:0}.notes li b{font-family:var(--mono);font-weight:500;flex:none}
.notes li.warn{color:var(--warn)}.notes li.error{color:var(--bad)}
#live{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;margin:0;max-width:min(560px,calc(100vw - 32px));box-sizing:border-box;
  background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow)}
#live:empty{display:none}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s,color .15s,transform .1s}button:active{transform:translateY(1px)}}
</style>
<div class="shell">
<aside class="side">
  <div class="brand"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="var(--acbg)"/><path d="M16 4.5l2.2 4.6 4.6-1.8-1.5 4.7 5 1.7-4 2.8 2.6 4.6-5.1-1.2L16 27.5l-3.8-7.6-5.1 1.2 2.6-4.6-4-2.8 5-1.7-1.5-4.7 4.6 1.8z" fill="var(--gold)"/><path d="M16 14v12" stroke="color-mix(in srgb,var(--gold) 70%,#000)" stroke-width="1.6" stroke-linecap="round"/></svg><b>Sapline</b></div>
  <nav aria-label="Sections">
    <button data-nav="exp" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
    <button data-nav="runs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Runs</button>
    <button data-nav="mobs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M8 5l-2-3M16 5l2-3M9.5 13h.01M14.5 13h.01M10 16c1 1 3 1 4 0"/></svg>Mobs</button>
    <button data-nav="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
  </nav>
  <div class="sp"></div>
  <div class="status" aria-live="polite">
    <span id="chip" class="lchip"><i></i><span>Starting…</span></span>
    <p id="chipsub" class="mu">Opening…</p>
    <div class="xctl"><button class="go" data-x="go" id="go">Start recording</button></div>
  </div>
</aside>
<main><div id="app" tabindex="-1"></div></main>
</div>
<p id="live" role="status" aria-live="polite"></p>
<script>
/* Sapline: the page Sapline shows. It asks the app (http://127.0.0.1:8765) for its state once a second and
   sends button presses as small requests. Nothing here talks to anything but the app on this PC. */
const $ = s => document.querySelector(s),
  fmt = n => Math.round(n).toLocaleString("en-US"),
  esc = x => String(x).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]),
  KEY = "sap1",
  LOCAL = location.protocol === "http:" && /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
let view = "exp",
  xr = "session", // the chart: this session or the last 7 days
  xkind = "bars", // bars or a line
  xlog = false,   // ...on a log scale
  xren = null;    // the run being renamed
const APP = { seq: 0, st: null, notes: [], lost: false };
const segBtns = (name, cur, opts) =>
  `<span class="seg" role="group">${opts.map(([v, t]) => `<button data-${name}="${v}" aria-pressed="${v === cur}">${t}</button>`).join("")}</span>`;
const mins = m => (m < 60 ? m + " min" : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} min`);
const tile = (k, v, sub) => `<div class="card tile"><span class="k">${k}</span><span class="v">${v}</span><span class="mu">${sub || ""}</span></div>`;
const head = (title, sub, acts) => `<header class="ph"><div><h1>${title}</h1><p>${sub}</p></div>${acts ? `<div class="pa">${acts}</div>` : ""}</header>`;
const MOB_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M8 5l-2-3M16 5l2-3M9.5 13h.01M14.5 13h.01M10 16c1 1 3 1 4 0"/></svg>';
async function api(path, body) {
  try {
    const r = await fetch(path, { method: "POST", headers: { "X-Sapline": "1", "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    return await r.json();
  } catch (e) {
    return { ok: false, error: "No answer from Sapline." };
  }
}
// Short messages ("Counting again from now") show at the bottom of the window for a few seconds
function say(m) {
  const el = $("#live");
  el.textContent = m;
  clearTimeout(say.t);
  say.t = setTimeout(() => (el.textContent = ""), 6000);
}
function setTheme(dark) {
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  try { localStorage.setItem(KEY + ":theme", dark ? "dark" : "light"); } catch (e) {}
  const b = $("#theme");
  if (b) b.textContent = dark ? "Switch to day" : "Switch to night";
}
const isDark = () => document.documentElement.dataset.theme === "dark";
function saveCharts() {
  try { localStorage.setItem(KEY + ":charts", JSON.stringify({ xk: xkind, xs: xlog })); } catch (e) {}
}
/* ===== Talking to the app ===== */
async function pull(force) {
  try {
    const r = await fetch("/api/state?since=" + APP.seq, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    APP.st = j;
    APP.lost = false;
    for (const e of j.events) if (e.seq > APP.seq) APP.notes.unshift(e);   // (two polls can overlap after Save)
    APP.notes.length = Math.min(APP.notes.length, 12);
    APP.seq = Math.max(APP.seq, j.seq);
    drawChip();
    if (view === "exp") drawExp(force);
    else if (view === "runs") drawRuns(force);
    else if (view === "mobs") drawMobs(force);
    else if (view === "more") updOpts(j);
  } catch (e) {
    APP.lost = true;
    drawChip();
  }
}
async function appPull() {
  await pull();
  setTimeout(appPull, 1000);
}
// What the recorder is doing, in a few words: the status card at the bottom of the menu
function recState() {
  const st = APP.st || {}, x = st.exp;
  if (APP.lost) return { cls: "off", text: "Sapline has closed", sub: "Open Sapline again from the Start menu or the desktop icon." };
  if (!st.exp_on) return { cls: "", text: "Not recording", sub: "Press Start recording when you are ready to hunt. Nothing is read until then." };
  if (!x) return st.exp_found
    ? { cls: "wait", text: "Reading your EXP…", sub: "The first numbers come after two readings agree." }
    : { cls: "wait", text: "Looking for the EXP line", sub: "Keep the game's status bar (HP, MP, EXP) on screen and uncovered." };
  if (x.idle) return { cls: "wait", text: `Paused · Lv ${x.level || "—"}`, sub: "No EXP for a while. The clock starts again at your next gain." };
  return { cls: "on", text: `Recording · Lv ${x.level || "—"}`,

function drawMobs(force) {
  const st = APP.st || {}, x = st.exp,
    hunt = (x && x.run && x.run.kills) || [],
    sess = (x && x.kills) || [],
    cards = hunt.length ? hunt : sess,                       // the cards: this hunt, or the session when no hunt is going
    shown = new Set(cards.filter(k => k.name || k.n > 1).map(k => k.exp)),   // the ones that got a card
    sum = all => fmt(all.reduce((a, k) => a + k.n, 0)),
    nameBox = k => `<label><span>Name</span><input class="mn" data-mn="${k.exp}" maxlength="40" placeholder="Type the mob's name" aria-label="Name this mob"></label>`,
    card = k => `<article class="card mob"><div class="pic">${k.pic ? `<img src="/api/mobpic/${k.exp}.png?v=${k.pic}" alt="Picture of the mob, cut from your screen">` : MOB_ICON}</div><div class="body">` +
      `<div class="row"><span class="num gold" style="font-weight:700">${fmt(k.exp)} EXP</span><span class="mu"><b class="num" style="color:var(--tx)">${fmt(k.n)}</b> kill${k.n > 1 ? "s" : ""} · <b class="num" style="color:var(--tx)">${fmt(k.exp * k.n)}</b> EXP</span></div>` +
      (k.name ? `<b style="font-size:16px">${esc(k.name)}</b>` : nameBox(k)) +
      `<div class="btns">${k.name ? "" : `<button class="pri" data-mns="${k.exp}">Save</button>`}${k.pic ? `<button data-mnx="${k.exp}">Not this mob</button>` : ""}</div></div></article>`,
    // amounts seen once in a party are shared mobs or quests: one "Other gains" line
    named = all => all.filter(k => k.name || k.n > 1), other = all => all.filter(k => !(k.name || k.n > 1)).reduce((a, k) => a + k.n, 0),
    trow = k => `<tr><td>${k.name ? `<b>${esc(k.name)}</b>` : shown.has(k.exp) ? '<span class="mu">Not named yet</span>'
        : `<input class="mn" data-mn="${k.exp}" maxlength="40" placeholder="Name this mob" aria-label="Name this mob"><button class="pri" data-mns="${k.exp}">Save</button>`}</td>` +
      `<td class="num r">${fmt(k.exp)}</td><td class="num r">${fmt(k.n)}</td><td class="num r gold">${fmt(k.exp * k.n)}</td></tr>`;
  put(head("Mobs", (hunt.length ? "This hunt" + (x.run.map ? " · " + esc(x.run.map) : "") + ". " : "") + "Mobs are told apart by the EXP they give; a name stays once saved.",
      sess.length ? `<span class="card" style="padding:8px 12px;font-size:13px;font-weight:700">${sum(sess)} kills this session</span>` : "") +
    (cards.length
      ? `<div class="g2">${named(cards).map(card).join("")}` +
        (other(cards) ? `<section class="card" style="border-style:dashed;justify-content:center"><b>Other gains</b><span class="mu">${fmt(other(cards))} kill${other(cards) > 1 ? "s" : ""} of amounts seen once: shared mobs in a party, or quest rewards.</span></section>` : "") + `</div>`
      : `<section class="card"><b>No kills yet</b><p class="mu">Kills show here as your EXP goes up.</p></section>`) +
    (hunt.length && sess !== hunt && sess.length ? `<section class="card tcard" aria-label="This session"><h2>This session</h2><div class="tw"><table><thead><tr><th>Mob</th><th class="r">EXP each</th><th class="r">Kills</th><th class="r">EXP from it</th></tr></thead><tbody>` +
      `${named(sess).map(trow).join("")}${other(sess) ? `<tr><td class="mu">Other gains</td><td class="num r">—</td><td class="num r">${fmt(other(sess))}</td><td class="num r">—</td></tr>` : ""}</tbody></table></div>` +
      `<p class="mu tfoot">Kills are counted from each rise of your EXP. Two mobs that give the same EXP are counted as one, and a rise worth two to six of a mob counts as that many kills of it.</p></section>` : ""), force);
}
/* ===== Settings ===== */
const PAUSE = [1, 2, 3, 5, 10, 15, 20, 30];
const sw = (id, title, desc, on) => `<label class="opt" for="${id}"><span><b>${title}</b><span class="mu">${desc}</span></span><input type="checkbox" id="${id}"${on ? " checked" : ""}></label>`;
function drawMore() {
  const st = APP.st || {}, se = st.settings || {}, idle = +(se.idle_min || 1),
    pauses = PAUSE.includes(idle) ? PAUSE : [...PAUSE, idle].sort((a, b) => a - b);
  $("#app").innerHTML = head("Settings", "Changes save as you make them.") + `<div class="g2">` +
    `<section class="card" aria-label="Recording"><h2>Recording</h2>` +
    sw("ox", "Start when Sapline opens", "Off: Sapline waits until you press Start recording.", !!se.autostart) +
    sw("ol", "Log my runs", "Keep one line per hunt on the Runs page.", se.exp_log !== false) +
    `<div class="opt"><label for="oi"><b>Pause after</b><span class="mu">Minutes without EXP before the clock stops, so a break does not drag your EXP per hour down.</span></label>` +
    `<select id="oi">${pauses.map(n => `<option value="${n}"${idle === n ? " selected" : ""}>${n} min</option>`).join("")}</select></div>` +
    sw("ofp", "Save fight pictures", "Only for fixing wrong mob pictures: keeps the screenshots around each kill. Off again at the next start.", !!se.fight_pics) +
    `<div class="opt"><label for="ocap"><b>Screen capture</b><span class="mu" id="capline"></span></label>` +
    `<select id="ocap"><option value="auto"${se.capture !== "standard" ? " selected" : ""}>Fast when possible</option><option value="standard"${se.capture === "standard" ? " selected" : ""}>Standard</option></select></div>` +
    `</section>` +
    `<section class="card" aria-label="App"><h2>App</h2>` +
    `<div class="opt"><span><b>Map names and mesos</b><span class="mu" id="tess"></span></span><button id="tessgo" class="pri" hidden>Install Tesseract</button></div>` +
    `<div class="opt"><span><b>Updates</b><span class="mu" id="updline"></span></span><button id="updcheck">Check now</button></div>` +
    `<div class="opt"><span><b>Your data</b><span class="mu">Runs, day totals and mob pictures, in the folder next to Sapline.</span></span><button id="oscans">Open folder</button></div>` +
    `<div class="opt"><span><b>Save a screenshot</b><span class="mu">Puts a picture of your screen in that folder, to send when something is not being read (the mesos, the map, the level).</span></span><button id="oshot">Save now</button></div>` +
    `<div class="opt"><span><b>Look</b><span class="mu">Night or day colours.</span></span><button id="theme">${isDark() ? "Switch to day" : "Switch to night"}</button></div></section></div>` +
    `<p class="mu" style="margin:0;line-height:1.5"><b style="color:var(--tx)">Sapline only looks at your screen.</b> It never clicks, types, reads the game's memory or sends anything anywhere. ` +
    `Nexon has not said whether screen readers are allowed; on a private server, ask a GM first. Fan project, not affiliated with Nexon.</p>`;
  const done = r => r.ok || say(r.error || "Could not save that setting.");
  $("#ox").onchange = e => api("/api/set", { autostart: e.target.checked }).then(done);
  $("#ol").onchange = e => api("/api/set", { exp_log: e.target.checked }).then(done);
  $("#oi").onchange = e => api("/api/set", { idle_min: +e.target.value }).then(done);
  $("#ofp").onchange = e => api("/api/set", { fight_pics: e.target.checked }).then(done);
  $("#ocap").onchange = e => api("/api/set", { capture: e.target.value }).then(r => (r.ok ? say("Saved. It is used from the next Start recording.") : done(r)));
  $("#oscans").onclick = () => api("/api/open-scans").then(r => r.ok || say(r.error || "Could not open the folder."));
  $("#oshot").onclick = () => api("/api/screenshot").then(r => say(r.ok ? `Saved ${r.file} in the scans folder.` : r.error || "Could not save a screenshot."));
  $("#tessgo").onclick = () => api("/api/install-tesseract").then(r => say(r.ok ? "Installing Tesseract. Click Yes if Windows asks." : r.error || "Could not start the installer."));
  $("#updcheck").onclick = async () => {
    $("#updline").textContent = "Checking…";
    const r = await api("/api/update-check");
    say(r.ok === false ? r.error || "Could not check." : "Checked for updates.");
  };
  $("#theme").onclick = () => setTheme(!isDark());
  updOpts(st);
}
// What the screen capture is doing, for the Settings row (capture.py: fast = Desktop Duplication, standard = a plain copy)
function capLine(st) {
  const c = st.capture, se = st.settings || {};
  if (!st.exp_on || !c || !c.how) return se.capture === "standard" ? "A plain copy of the screen about once a second." : "Fast capture (the picture the graphics card already has) when it works, a plain copy otherwise. Checked when recording starts.";
  return c.how === "fast" ? "Recording with fast capture." : `Recording with standard capture. ${c.why || ""}`;
}
function updOpts(st) {
  const line = $("#updline");
  if (!line) return;
  const cap = $("#capline");
  if (cap) cap.textContent = capLine(st);
  if ($("#ocap") && (document.activeElement || {}).id !== "ocap") $("#ocap").value = (st.settings || {}).capture === "standard" ? "standard" : "auto";
  const u = st.update || {}, v = st.version ? `You have ${st.version}.` : "";
  line.textContent = v + " " + ({
    none: "That is the newest.", available: `${u.version} is ready: see Home.`, downloading: "Downloading the new version…", installing: "Installing…",
    checking: "Checking…", offline: "Can't reach GitHub right now.", unavailable: "No release to check yet.", off: "Update checks are switched off."
  }[u.state] || "");
  const se = st.settings || {}, ae = document.activeElement || {};
  for (const [id, v] of [["ox", !!se.autostart], ["ol", se.exp_log !== false], ["ofp", !!se.fight_pics]]) if (ae.id !== id) $("#" + id).checked = v;
  if (ae.id !== "oi" && [...$("#oi").options].some(o => +o.value === +se.idle_min)) $("#oi").value = +se.idle_min;
  $("#tess").textContent = st.tesseract ? "✓ Installed. Map names and mesos are read for the run log." : "Not installed. EXP works without it.";
  $("#tess").className = st.tesseract ? "up" : "mu";
  $("#tessgo").hidden = !!st.tesseract;
}
/* ===== Buttons ===== */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-x],[data-xr],[data-xk],[data-xs],[data-xl],[data-mns],[data-mnx],[data-upd],[data-page]");
  if (!b) return;
  const d = b.dataset;
  if (d.xl) {
    const done = r => r.ok || say(r.error || "Could not change the run log.");
    if (d.xl === "on") api("/api/set", { exp_log: b.checked }).then(done);
    else if (d.xl === "rename") { xren = d.id; drawRuns(true); }
    else if (d.xl === "save") { api("/api/exp-log", { action: "rename", id: d.id, name: $("#xrn").value }).then(done); xren = null; drawRuns(true); }
    else if (d.xl === "delete") api("/api/exp-log", { action: "delete", id: d.id }).then(done);
  } else if (d.mns !== undefined || d.mnx !== undefined) {
    const exp = +(d.mns !== undefined ? d.mns : d.mnx),
      body = d.mns !== undefined ? { exp, name: ($(`[data-mn="${exp}"]`) || {}).value || "" } : { exp, action: "forget" };
    if (d.mns !== undefined && !body.name.trim()) return say("Type the mob's name first.");
    api("/api/mob-name", body).then(r => (r.ok ? pull(true).then(() => say(d.mnx !== undefined ? "Picture dropped. The next clear kill takes a new one." : `Saved: ${body.name.trim()} gives ${fmt(exp)} EXP.`))
      : say(r.error || "Could not save that.")));
  } else if (d.xr || d.xk || d.xs) {
    if (d.xr) xr = d.xr;
    if (d.xk) xkind = d.xk;
    if (d.xs) xlog = d.xs === "log";
    saveCharts();
    drawExp(true);
  } else if (d.x === "go") api("/api/set", { exp: !(APP.st && APP.st.exp_on) }).then(r => r.ok || say(r.error || "Could not change EXP recording."));
  else if (d.x === "reset") api("/api/exp-reset").then(r => say(r.ok ? "Counting again from now" : r.error || "Could not reset."));
  else if (d.upd) api("/api/update").then(r => r.ok || say(r.error || "Could not start the update."));
  else if (d.page) window.open(d.page, "_blank", "noopener");
});
// Enter in a name box presses its Save button (never return false: that would eat the key)
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !(e.target.id === "xrn" || e.target.classList.contains("mn"))) return;
  const box = e.target.closest(".mob,td"), b = box && box.querySelector("[data-xl=save],[data-mns]");
  if (b) { e.preventDefault(); b.click(); }
});
document.querySelectorAll("[data-nav]").forEach(b => (b.onclick = () => { view = b.dataset.nav; xren = null; draw(); }));
try {
  const t = localStorage.getItem(KEY + ":theme"), c = JSON.parse(localStorage.getItem(KEY + ":charts") || "{}");
  // night first: the game window is dark and the app sits beside it; the Look setting remembers a change
  document.documentElement.dataset.theme = t === "dark" || t === "light" ? t : "dark";
  if (c.xk === "line") xkind = "line";
  xlog = !!c.xs;
} catch (e) {
  document.documentElement.dataset.theme = "dark";
}
draw();
if (LOCAL) appPull();
</script>
