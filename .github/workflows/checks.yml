# Automatic checks and builds.
#   linux:   every push and pull request: the reader, server, update and browser checks.
#   windows: main, pull requests, version tags, a manual run, or a push whose message says [windows]
#            (Windows minutes cost double on a private repository): the reader checks with real Windows
#            Tesseract, then builds MapleReader.exe and the installer, and tries both for real.
#   release: when main has a version (shopreader/__init__.py) that isn't released yet, or a tag like
#            v2026-10-20g is pushed, the installer and its .sha256 are published as release v<version>.
#            So releasing = bump __version__, merge to main.
name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # a newer push to a pull request replaces its older run; pushes each finish (a quick follow-up push must not
  # throw away a Windows build that is half done)
  group: checks-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MAPLEREADER_UPDATE_API: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tesseract and Python packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr
          tesseract --version | head -1
          python -m pip install -q -r MapleReader/requirements.txt playwright==1.64.1 pyflakes==4.0.3
          python -m playwright install --with-deps chromium
      - name: Code check (pyflakes)
        run: python -m pyflakes MapleReader tools dev-tests
      - name: All checks
        run: bash dev-tests/run_all.sh

  windows:
    if: >-
      github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[windows]')
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      MAPLEREADER_UPDATE_API: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tesseract, Inno Setup and Python packages
        run: |
          choco install tesseract innosetup -y --no-progress
          if (-not (Test-Path "C:\Program Files\Tesseract-OCR\tesseract.exe")) { throw "Tesseract is not where MapleReader looks for it" }
          & "C:\Program Files\Tesseract-OCR\tesseract.exe" --version
          python -m pip install -q -r MapleReader/requirements-build.txt
      - name: Reader checks (real Windows Tesseract)
        working-directory: MapleReader
        run: |
          $ErrorActionPreference = "Stop"; $PSNativeCommandUseErrorActionPreference = $true
          foreach ($t in "test_exp", "test_mobpics", "test_server", "test_update") { python "tests\$t.py" }
      - name: Version
        id: ver
        run: |
          $v = python -c "import sys; sys.path.insert(0, 'MapleReader'); from shopreader import __version__; print(__version__)"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") { throw "Tag ${{ github.ref_name }} doesn't match the app's version $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build MapleReader.exe
        run: python MapleReader\build_app.py --dist dist
      - name: Self-check the built exe
        timeout-minutes: 10
        run: |
          # wait for that one program only (Start-Process -Wait would also wait for anything it starts), at most 5 minutes
          $p = Start-Process dist\MapleReader\MapleReader.exe -ArgumentList "--self-check", "$pwd\exe_check.txt" -PassThru
          if (-not $p.WaitForExit(300000)) { $p | Stop-Process -Force; throw "The self-check didn't finish in 5 minutes" }
          Get-Content exe_check.txt
          if ($p.ExitCode -ne 0) { throw "The built exe failed its self-check" }
      - name: Build the installer
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$v" "/DSrc=$pwd\dist\MapleReader" "/O$pwd\out" MapleReader\installer\MapleReader.iss
          if ($LASTEXITCODE -ne 0) { throw "The installer didn't build" }
          $name = "MapleReader-Setup-$v.exe"
          $hash = (Get-FileHash "out\$name" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$pwd\out\$name.sha256", "$hash  $name`n")
          Get-ChildItem out
      - name: Install it quietly, self-check the installed copy, uninstall
        timeout-minutes: 20
        run: |
          # Start-Process -Wait would wait for everything a program starts, and the setup starts MapleReader
          # (which runs until its window closes), so wait for each program itself, at most 5 minutes
          function Run-And-Wait($file, $argv, $what) {
            $p = Start-Process $file -ArgumentList $argv -PassThru
            if (-not $p.WaitForExit(300000)) { $p | Stop-Process -Force; throw "$what didn't finish in 5 minutes" }
            return $p.ExitCode
          }
          $v = "${{ steps.ver.outputs.version }}"
          $code = Run-And-Wait "out\MapleReader-Setup-$v.exe" @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") "The installer"
          if ($code -ne 0) { throw "The installer failed ($code)" }
          Start-Sleep 8
          $started = @(Get-Process MapleReader -ErrorAction SilentlyContinue).Count
          "MapleReader started by the installer: $started"
          if ($started -lt 1) { throw "The installer didn't start MapleReader (updates rely on that)" }
          Get-Process MapleReader, msedge -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          $app = "$env:LOCALAPPDATA\Programs\MapleReader"
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\MapleReader.lnk")) { throw "No Start-menu icon" }
          $code = Run-And-Wait "$app\MapleReader.exe" @("--self-check", "$pwd\installed_check.txt") "The installed copy's self-check"
          Get-Content installed_check.txt
          if ($code -ne 0) { throw "The installed copy failed its self-check" }
          # an update the way the app does it: MapleReader is running (window and all), the app's own install script
          # waits for it to close, runs the setup quietly with a log, and MapleReader comes back; the data stays
          New-Item -ItemType Directory -Force "$app\scans", "$app\updates" | Out-Null; Set-Content "$app\scans\exp_log.json" "[]"
          $run = Start-Process "$app\MapleReader.exe" -PassThru
          Start-Sleep 10
          Copy-Item "out\MapleReader-Setup-$v.exe" "$app\updates\"     # after the start: the app drops old setup files as it starts
          $env:PYTHONPATH = "$pwd\MapleReader"
          python -c "from shopreader import update; update.start_install(r'$app\updates\MapleReader-Setup-$v.exe', pid=$($run.Id), app_exe=r'$app\MapleReader.exe')"
          # PowerShell takes a while to start on a busy runner: give the script's first log line up to a minute
          $t0 = Get-Date
          while (((Get-Date) - $t0).TotalSeconds -lt 60 -and -not (Test-Path "$app\updates\install.log")) { Start-Sleep 2 }
          if (-not (Test-Path "$app\updates\install.log")) { throw "The install script wrote no log: it did not run" }
          Stop-Process -Id $run.Id -Force; Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force   # (the app closes itself in real life)
          $deadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $deadline -and -not ((Get-Content "$app\updates\install.log" -Raw) -match "done")) { Start-Sleep 3 }
          Get-Content "$app\updates\install.log"
          if (-not ((Get-Content "$app\updates\install.log" -Raw) -match "finished with code 0")) { throw "The update did not install (install.log above)" }
          if (-not (Test-Path "$app\updates\setup.log")) { throw "The setup wrote no setup.log" }
          Start-Sleep 5
          $back = @(Get-Process MapleReader -ErrorAction SilentlyContinue).Count
          "MapleReader running after the update: $back"
          if ($back -lt 1) { throw "MapleReader did not come back after the update" }
          Get-Process MapleReader, msedge -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          if ((Get-Content "$app\scans\exp_log.json") -ne "[]") { throw "An update lost the run log" }
          $code = Run-And-Wait "$app\unins000.exe" @("/VERYSILENT", "/SUPPRESSMSGBOXES") "The uninstaller"
          Start-Sleep 3
          if (Test-Path "$app\MapleReader.exe") { throw "Uninstall left the program behind" }
          "install, update over the top, self-check and uninstall all fine"
      - uses: actions/upload-artifact@v7
        with:
          name: MapleReader-Setup-${{ steps.ver.outputs.version }}
          path: out/*
          retention-days: 14

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Is this version released already?
        id: new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.windows.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /dev/null 2>&1; then
            echo "$TAG is released already: nothing to do"; echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "publishing $TAG"; echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.new.outputs.new == 'true'
        uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - if: steps.new.outputs.new == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64   # v3.0.3, pinned: this step can write releases
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MapleReader ${{ needs.windows.outputs.version }}
          files: out/*
          generate_release_notes: true
